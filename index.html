/* =========================================================
   Page Carte (clients géolocalisés via OpenStreetMap/Leaflet)
   ========================================================= */

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

// Pin rouge (couleur alignée sur --crit-critical) pour un client ayant au
// moins une alerte critique active, à la place du pin bleu par défaut de
// Leaflet, construit une seule fois au premier besoin.
let criticalMarkerIcon = null;
function getCriticalMarkerIcon() {
  if (!criticalMarkerIcon) {
    criticalMarkerIcon = L.divIcon({
      className: "",
      html: `<svg width="25" height="41" viewBox="0 0 25 41" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0z" fill="#ef4444"/>
        <circle cx="12.5" cy="12.5" r="5" fill="#fff"/>
      </svg>`,
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
    });
  }
  return criticalMarkerIcon;
}

// Géocodage gratuit via Nominatim (OpenStreetMap) : pas de clé API, mais
// limité à 1 requête/seconde et à utiliser avec parcimonie. Les résultats
// sont mis en cache dans le navigateur (une adresse d'entreprise change
// rarement) pour ne géocoder chaque client qu'une seule fois.
async function geocodeAddress(address) {
  const cacheKey = "rgdash-geocode:" + address;
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) return { point: JSON.parse(cached), cached: true };
  } catch (e) { /* stockage indisponible : on re-géocode simplement */ }

  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(address);
  const res = await fetch(url);
  if (!res.ok) throw new Error(t("geocoding_unavailable", { status: res.status }));
  const results = await res.json();
  if (!results.length) return { point: null, cached: false };
  const point = { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
  try { localStorage.setItem(cacheKey, JSON.stringify(point)); } catch (e) { /* pas bloquant */ }
  return { point, cached: false };
}

// Exécute `items` via `fn` avec au plus `limit` appels en parallèle.
async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

let mapInstance = null;
let mapLoaded = false; // évite de re-géocoder à chaque retour sur la page

function renderUnlocatedClients(unlocated) {
  const el = document.getElementById("mapUnlocated");
  if (unlocated.length === 0) { el.hidden = true; return; }
  const rows = unlocated.map((c) => `
    <div class="note-item">
      <div class="version">${escapeHtml(c.name)}</div>
      <div class="text">${escapeHtml(c.reason)} — <a href="#/parc/node/${encodeURIComponent(c.id)}">${t("map_see_client")}</a></div>
    </div>
  `).join("");
  el.innerHTML = `<div class="chart-cat">${t("map_unlocated", { n: unlocated.length })}</div><div class="list">${rows}</div>`;
  el.hidden = false;
}

async function loadMapPage() {
  const statusEl = document.getElementById("mapStatus");
  const containerEl = document.getElementById("mapContainer");
  const unlocatedEl = document.getElementById("mapUnlocated");

  if (mapLoaded) {
    statusEl.hidden = true;
    containerEl.style.display = "block";
    if (mapInstance) setTimeout(() => mapInstance.invalidateSize(), 0);
    return;
  }

  statusEl.hidden = false;
  statusEl.textContent = t("map_loading_clients");
  containerEl.style.display = "none";
  unlocatedEl.hidden = true;

  try {
    // On rafraîchit aussi les alertes (pas seulement les agents) : c'est ce
    // qui permet de savoir quel client a au moins un ticket critique en cours,
    // pour colorer son épingle en rouge sur la carte.
    const [agents] = await Promise.all([loadAllAgents(), loadAlerts()]);
    const criticalAgentIds = new Set(
      lastIncidents.filter((inc) => !inc.acquitted && inc.criticality === "critical").map((inc) => inc.agentId)
    );

    const customers = new Map();
    for (const a of agents) {
      if (!a.customer?.id) continue;
      if (!customers.has(a.customer.id)) {
        customers.set(a.customer.id, { id: a.customer.id, name: a.customer.name, hasCritical: false });
      }
      if (criticalAgentIds.has(a.agentId)) {
        customers.get(a.customer.id).hasCritical = true;
      }
    }

    if (customers.size === 0) {
      statusEl.textContent = t("map_no_clients");
      return;
    }

    const pins = [];
    // On garde une trace des clients qu'on n'arrive pas à placer sur la carte
    // (adresse absente ou non reconnue par le géocodeur) : sans ça, un client
    // disparaît silencieusement de la carte sans que personne ne s'en aperçoive.
    const unlocated = [];

    // Étape 1 : récupérer les fiches client (nom, adresse) en parallèle — ces
    // appels passent par notre propre relais et ne sont pas soumis à la limite
    // de Nominatim, inutile de les faire un par un.
    statusEl.textContent = t("map_fetching_details", { i: 0, n: customers.size });
    let fetched = 0;
    const customerList = Array.from(customers.values());
    const detailsList = await mapLimit(customerList, 5, async (customer) => {
      try {
        const details = await fetchJson(`/api/node/${encodeURIComponent(customer.id)}/customer`);
        fetched++;
        statusEl.textContent = t("map_fetching_details", { i: fetched, n: customers.size });
        return { customer, details, error: null };
      } catch (err) {
        fetched++;
        console.error("Client " + customer.id + " :", err);
        return { customer, details: null, error: err };
      }
    });

    // Étape 2 : géocoder chaque adresse. Nominatim impose 1 requête/seconde,
    // mais on ne fait vraiment cette pause que quand on interroge Nominatim —
    // une adresse déjà en cache est traitée immédiatement.
    let i = 0;
    for (const { customer, details, error } of detailsList) {
      i++;
      if (error) {
        unlocated.push({ id: customer.id, name: customer.name, reason: t("map_error_prefix") + error.message });
        continue;
      }
      const name = details.companyName || customer.name;
      if (!details.companyAddress) {
        unlocated.push({ id: customer.id, name, reason: t("map_reason_no_address") });
        continue;
      }
      statusEl.textContent = t("map_locating", { i, n: detailsList.length });
      try {
        const { point, cached } = await geocodeAddress(details.companyAddress);
        if (point) {
          pins.push({ ...point, name, address: details.companyAddress, nodeId: customer.id, hasCritical: customer.hasCritical });
        } else {
          unlocated.push({ id: customer.id, name, reason: t("map_reason_bad_address", { addr: details.companyAddress }) });
        }
        if (!cached) await sleep(1000); // politique d'usage Nominatim : 1 requête/seconde max
      } catch (err) {
        unlocated.push({ id: customer.id, name, reason: t("map_error_prefix") + err.message });
        console.error("Client " + customer.id + " :", err);
      }
    }

    renderUnlocatedClients(unlocated);

    if (pins.length === 0) {
      statusEl.textContent = t("map_none_located");
      return;
    }

    statusEl.hidden = true;
    containerEl.style.display = "block";

    mapInstance = L.map(containerEl);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(mapInstance);

    const markers = pins.map((pin) => {
      const marker = L.marker([pin.lat, pin.lng], pin.hasCritical ? { icon: getCriticalMarkerIcon() } : {}).addTo(mapInstance);
      marker.bindPopup(
        `<strong>${escapeHtml(pin.name)}</strong><br>${escapeHtml(pin.address)}<br>` +
        (pin.hasCritical ? `<span style="color:#ef4444;font-weight:600;">${t("map_critical_popup")}</span><br>` : "") +
        `<a href="#/parc/node/${encodeURIComponent(pin.nodeId)}">${t("map_link_parc")}</a>` +
        (pin.hasCritical ? ` · <a href="#/alerts/client/${encodeURIComponent(pin.nodeId)}">${t("map_link_alerts")}</a>` : "") +
        ` · <a href="#/clients/${encodeURIComponent(pin.nodeId)}">${t("map_link_client_sheet")}</a>`
      );
      return marker;
    });

    if (markers.length > 1) {
      mapInstance.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
    } else {
      mapInstance.setView([pins[0].lat, pins[0].lng], 13);
    }

    mapLoaded = true;
  } catch (err) {
    statusEl.hidden = false;
    statusEl.textContent = t("generic_error_prefix") + err.message;
    console.error(err);
  }
}

async function refreshMap() {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapLoaded = false;
  // On force aussi le rafraîchissement de la liste des agents/clients (cache
  // partagé avec la recherche) : un nouveau client ajouté depuis la dernière
  // ouverture de la carte doit apparaître sans recharger toute la page.
  allAgentsCache = null;
  allAgentsPromise = null;
  await loadMapPage();
}
document.getElementById("mapRefreshBtn").addEventListener("click", () => refreshMap());

// Un seul point d'entrée pour "actualiser la page actuelle", utilisé par les
// boutons ↻ de chaque écran ET par le geste de tirage tactile (pull-to-refresh)
// plus bas — les deux déclenchent toujours exactement la même action.
async function refreshCurrentPage() {
  if (currentPage === "alerts") {
    await loadAlerts();
  } else if (currentPage === "map") {
    await refreshMap();
  } else if (currentPage === "parc") {
    if (!parcAgentView.hidden) {
      if (currentAgentId != null) await loadAgent(currentAgentId);
    } else if (!parcTreeView.hidden) {
      if (currentTreeNodeId != null) {
        allAgentsCache = null;
        allAgentsPromise = null;
        await loadNode(currentTreeNodeId);
      }
    }
    // Vue "Résultats de recherche" : rien de dédié à rafraîchir.
  }
  // Page "Nouveautés" : contenu statique, rien à recharger.
}

// Pas de cache dédié : loadAllAgents() est déjà mise en cache, recalculer la

async function getClientsList() {
  const agents = await loadAllAgents();

      byId.set(a.customer.id, { id: a.customer.id, name: a.customer.name || t("client_no_name") });

/* =========================================================
   Routeur (hash-based)
   ========================================================= */

const pageAlerts = document.getElementById("page-alerts");
const pageParc = document.getElementById("page-parc");
const pageMap = document.getElementById("page-map");
const pageClients = document.getElementById("page-clients");
const pageWhatsNew = document.getElementById("page-whatsnew");
const parcTreeView = document.getElementById("parcTreeView");
const parcAgentView = document.getElementById("parcAgentView");
const searchBarWrap = document.getElementById("searchBarWrap");

function parseHash() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/parc\/agent\/(.+)$/))) return { page: "parc", view: "agent", agentId: decodeURIComponent(m[1]) };
  if ((m = h.match(/^#\/parc\/node\/(.+)$/))) return { page: "parc", view: "tree", nodeId: decodeURIComponent(m[1]) };
  // Lien "Voir les alertes" depuis la carte : ouvre Alertes déjà filtré sur ce client.
  if ((m = h.match(/^#\/alerts\/client\/(.+)$/))) return { page: "alerts", clientId: decodeURIComponent(m[1]) };
  if ((m = h.match(/^#\/clients\/(.+)$/))) return { page: "clients", clientId: decodeURIComponent(m[1]) };
  if (h === "#/clients") return { page: "clients" };
  if (h === "#/alerts") return { page: "alerts" };
  if (h === "#/map") return { page: "map" };
  if (h === "#/whatsnew") return { page: "whatsnew" };
  return { page: "parc", view: "tree", nodeId: ROOT_NODE_ID }; // Parc = page par defaut
}

function router() {
  const r = parseHash();
  currentPage = r.page;

  pageAlerts.hidden = currentPage !== "alerts";
  pageParc.hidden = currentPage !== "parc";
  pageMap.hidden = currentPage !== "map";
  pageClients.hidden = currentPage !== "clients";
  pageWhatsNew.hidden = currentPage !== "whatsnew";
  // Le bouton 🔍 reste toujours visible (même sur Carte/Nouveautés) : cliquer
  // dessus bascule sur Parc avant d'ouvrir la recherche (cf. searchToggleBtn).
  // La hauteur de l'en-tête change d'une page à l'autre (barre de recherche
  // masquée sur Carte/Nouveautés) : on recalcule les décalages "sticky" à
  // chaque navigation plutôt que seulement une fois au chargement.
  updateStickyOffsets();

  if (currentPage === "alerts") {
    if (r.clientId !== undefined) {
      activeClientFilter = r.clientId;
      alertClientFilterEl.value = r.clientId; // ignoré silencieusement si l'option n'existe pas (encore)
    }
    renderAlertList();
    return;
  }
  if (currentPage === "map") {
    loadMapPage();
    return;
  }
  if (currentPage === "clients") {
    if (r.clientId !== undefined) loadClientDetail(r.clientId);
    else loadClientsList();
    return;
  }
  if (currentPage === "whatsnew") {
    renderWhatsNew();
    markWhatsNewSeen();
    return;
  }

  updateParcVisibility();
  if (searchQuery.trim().length >= 2) {
    renderParcSearch();
    return;
  }

  const onAgent = r.view === "agent";
  if (onAgent) loadAgent(r.agentId);
  else loadNode(r.nodeId);
}

window.addEventListener("hashchange", router);

document.getElementById("homeLink").addEventListener("click", () => {
  searchQuery = "";
  searchInputEl.value = "";
  location.hash = "#/parc";
});

// Empile les bandeaux .parc-header / .client-stats juste sous l'en-tête
// global pendant le défilement (position: sticky). La hauteur de l'en-tête
// n'est pas fixe (recherche repliée/dépliée, zone sûre iOS variable selon
// l'appareil) : on la mesure en JS plutôt que de la deviner en CSS.
const appHeaderEl = document.querySelector("header");
function applyStickyOffsets() {
  // Arrondi vers le haut (jamais vers le bas) : sur les écrans haute densité
  // (iPhone), une hauteur mesurée avec décimale (ex. 65.2px) peut être
  // arrondie différemment par le moteur de rendu pour l'élément sticky que
  // pour le contenu juste en dessous, créant un chevauchement d'1px. Arrondir
  // systématiquement vers le haut garantit qu'on ne sous-estime jamais
  // l'espace réservé (au pire un pixel de trop, jamais un chevauchement).
  const headerH = Math.ceil(appHeaderEl.offsetHeight);
  document.querySelectorAll(".parc-header").forEach((ph) => {
    ph.style.top = headerH + "px";
  });
  document.querySelectorAll(".client-stats").forEach((cs) => {
    const ph = cs.previousElementSibling;
    const phH = ph && ph.classList.contains("parc-header") ? Math.ceil(ph.offsetHeight) : 0;
    cs.style.top = (headerH + phH) + "px";
  });
}
function updateStickyOffsets() {
  applyStickyOffsets();
  // Filet de sécurité pour un bug connu de Safari iOS : un élément sticky ne
  // reprend pas toujours sa bonne position (chevauchement avec le contenu
  // suivant) quand la hauteur du contenu au-dessus change par script plutôt
  // que par un vrai scroll utilisateur. On refait le calcul juste après le
  // prochain repaint, une fois les hauteurs définitivement stables.
  requestAnimationFrame(applyStickyOffsets);
}
window.addEventListener("resize", updateStickyOffsets);
if (window.ResizeObserver) new ResizeObserver(updateStickyOffsets).observe(appHeaderEl);

/* =========================================================
   Tirer vers le bas pour actualiser (pull-to-refresh tactile)
   ========================================================= */

const PULL_TRIGGER = 60; // distance (px) au-delà de laquelle relâcher déclenche l'actualisation
const PULL_MAX = 80;
const pullIndicatorWrap = document.getElementById("pullIndicatorWrap");
const pullIndicatorEl = document.getElementById("pullIndicator");
let pullStartY = null;
let pullActive = false;
let pullRefreshing = false;

function pullEligible(target) {
  // Uniquement quand la page est déjà tout en haut (sinon c'est un scroll
  // normal), pas pendant une actualisation déjà en cours, pas quand le tiroir
  // ou la recherche sont ouverts (on ne veut pas interférer avec ces gestes),
  // et pas sur la carte (Leaflet gère déjà ses propres gestes de pan/zoom).
  return (
    window.scrollY <= 0 &&
    !pullRefreshing &&
    mainDrawer.hidden &&
    searchInputRow.hidden &&
    !(target && target.closest && target.closest("#mapContainer"))
  );
}

document.addEventListener("touchstart", (e) => {
  // Un pincement à deux doigts (zoom sur la carte) ne doit jamais être
  // interprété comme un tirage vers le bas.
  pullStartY = (e.touches.length === 1 && pullEligible(e.target)) ? e.touches[0].clientY : null;
  pullActive = false;
}, { passive: true });

document.addEventListener("touchmove", (e) => {
  if (pullStartY == null || pullRefreshing) return;
  if (e.touches.length > 1) { pullStartY = null; pullActive = false; return; }
  const dy = e.touches[0].clientY - pullStartY;
  if (dy <= 0 || !pullEligible(e.target)) { pullStartY = null; return; }
  pullActive = true;
  e.preventDefault(); // évite le rebond natif du navigateur pendant le tirage
  const dist = Math.min(dy * 0.5, PULL_MAX); // résistance : suit le doigt à moitié vitesse
  pullIndicatorWrap.style.transition = "none";
  pullIndicatorWrap.style.transform = `translate(-50%, ${dist - 34}px)`;
  pullIndicatorEl.classList.toggle("ready", dist >= PULL_TRIGGER);
}, { passive: false });

document.addEventListener("touchend", () => {
  pullIndicatorWrap.style.transition = "";
  if (!pullActive) { pullStartY = null; return; }
  const wasReady = pullIndicatorEl.classList.contains("ready");
  pullActive = false;
  pullStartY = null;
  if (!wasReady) {
    pullIndicatorWrap.style.transform = "";
    return;
  }
  pullRefreshing = true;
  pullIndicatorWrap.style.transform = `translate(-50%, ${PULL_TRIGGER - 34}px)`;
  pullIndicatorEl.classList.add("spinning");
  refreshCurrentPage().finally(() => {
    pullRefreshing = false;
    pullIndicatorEl.classList.remove("spinning", "ready");
    pullIndicatorWrap.style.transform = "";
  });
});

applyStaticTranslations();
loadAlerts();
router();

// Pas de service worker : ce dashboard n'a pas d'utilité hors-ligne, et un
// cache periodiquement perime a cause plus de soucis (pages figees apres une
// mise a jour) qu'il n'apporte de benefice. On se contente de nettoyer une
// eventuelle installation precedente (versions anterieures de cette app).
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => {
    regs.forEach((r) => r.unregister());
  });
}
if (window.caches) {
  caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
}
</script>
</body>
</html>
