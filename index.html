// "Onair" (Communication) est fusionné dans le groupe "Heartbeat" : ce sont
// deux indicateurs de présence de l'agent, plus lisibles regroupés.
const CHART_GROUP_OVERRIDE = { Onair: "Heartbeat" };

// Ordre d'affichage demandé (retour utilisateur) : présence de l'agent
// d'abord, puis capacité (disque, disque E/S, mémoire, CPU), puis sécurité et
// réseau. Tout groupe non listé (peu probable en pratique) est ajouté à la
// fin par ordre alphabétique plutôt que d'être perdu silencieusement.
const CHART_GROUP_ORDER = ["Heartbeat", "Disques", "Disques E/S", "Mémoire", "Processeurs", "Antivirus", "Trafic réseau"];

// "Octets Transmis par l'Agent" (bruit technique bas niveau, sans intérêt pour
// un diagnostic rapide) est volontairement exclu de l'affichage.
const EXCLUDED_CHART_COUNTERS = new Set(["SentBytes"]);

function collectChartables(objects) {
  const groups = new Map(); // nom de groupe affiché -> { name, items }
  for (const [key, cat] of Object.entries(objects || {})) {
    const items = [];
    for (const [objId, obj] of Object.entries(cat.objects || {})) {
      if (!obj.charts) continue;
      for (const [chartId, chart] of Object.entries(obj.charts)) {
        const countersStr = Array.isArray(chart.counters) ? chart.counters.join(" ") : (chart.counters || "");
        if (countersStr.split(" ").some((c) => EXCLUDED_CHART_COUNTERS.has(c))) continue;
        items.push({
          objId,
          chartId,
          chartName: chart.name,
          counters: chart.counters,
          objName: obj.name,
          isMono: cat.isMonoObject,
        });
      }
    }
    if (!items.length) continue;

    const groupName = CHART_GROUP_OVERRIDE[key] || cat.name;
    if (!groups.has(groupName)) groups.set(groupName, { name: groupName, items: [] });
    groups.get(groupName).items.push(...items);
  }
  const categories = [...groups.values()];
  categories.sort((a, b) => {
    const ia = CHART_GROUP_ORDER.indexOf(a.name);
    const ib = CHART_GROUP_ORDER.indexOf(b.name);
    if (ia === -1 && ib === -1) return a.name.localeCompare(b.name);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  return categories;
}

function chartItemHtml(item, groupName) {
  const base = item.isMono ? item.chartName : `${item.chartName} — ${item.objName}`;
  // Certains noms de courbe ("Actif") existent dans plusieurs groupes
  // (Heartbeat, Antivirus...) : on préfixe par le groupe pour lever
  // l'ambiguïté, sauf quand le nom du groupe est déjà redondant avec le libellé.
  const label = groupName && !base.toLowerCase().includes(groupName.toLowerCase())
    ? `${groupName} — ${base}`
    : base;
  const uid = item.objId + "_" + item.chartId;
  // Selon les agents, l'API renvoie "counters" soit en chaîne ("A B"), soit en tableau (["A","B"]).
  // On normalise ici en chaîne espacée pour que l'attribut data- et interpretChartData restent simples.
  const countersStr = Array.isArray(item.counters) ? item.counters.join(" ") : item.counters;
  return `
    <div class="chart-item">
      <button class="chart-toggle" data-uid="${uid}" data-obj="${item.objId}" data-chart="${item.chartId}" data-counters="${escapeHtml(countersStr)}">
        📈 ${escapeHtml(label)}
      </button>
      <div class="chart-panel" id="panel-${uid}" hidden></div>
    </div>`;
}

// Petite barre de filtres pill-shaped, réutilisée pour les alertes et les
// événements de la fiche agent (options = [[valeur, libellé], ...], valeur
// vide = "Toutes").
function miniFilterBarHtml(options, active, dataAttr) {
  const buttons = options.map(([val, label]) => {
    const isActive = (active || "") === val;
    return `<button type="button" class="mini-filter-btn ${isActive ? "active" : ""}" data-${dataAttr}="${escapeHtml(val)}">${escapeHtml(label)}</button>`;
  }).join("");
  return `<div class="mini-filter">${buttons}</div>`;
}

function incidentCriticality(inc) {
  return CRITICALITY_ORDER[inc.criticality] !== undefined ? inc.criticality : "low";
}

let agentAlertFilter = null; // null (Toutes) | "critical" | "medium" | "low"

function agentIncidentDetail(inc) {
  const parts = [];
  if (inc.category) parts.push(t("category_label") + inc.category);
  if (inc.displayId) parts.push(t("id_label") + inc.displayId);
  return parts.join("\n");
}

function renderAgentIncidents(agentId) {
  const all = lastIncidents.filter((inc) => inc.agentId === agentId && !inc.acquitted);
  const items = agentAlertFilter ? all.filter((inc) => incidentCriticality(inc) === agentAlertFilter) : all;
  const filterBar = all.length
    ? miniFilterBarHtml([["", t("filter_all")], ["critical", t("crit_critical")], ["medium", t("crit_medium")], ["low", t("crit_low")]], agentAlertFilter, "agent-alert-filter")
    : "";
  const toggleBar = items.length
    ? `<div class="mini-filter"><button type="button" class="mini-filter-btn" data-toggle-all-panels="agentAlertsSection">${t("show_all")}</button></div>`
    : "";
  const body = items.length
    ? items.map((inc, index) => {
        const crit = incidentCriticality(inc);
        const label = criticalityLabel(crit) || inc.criticality || "?";
        const detail = agentIncidentDetail(inc);
        const uid = "agent-alert-" + index;
        return `
          <div class="incident ${crit}" ${detail ? `data-uid="${uid}" style="cursor:pointer;"` : `style="cursor:default;"`}>
            <div class="title">${escapeHtml(translateAlertTitle(inc.title) || t("incident_no_title"))}</div>
            <div class="meta"><span class="badge ${crit}">${label}</span></div>
          </div>
          ${detail ? `<div class="chart-panel" id="panel-${uid}" hidden>${escapeHtml(detail).replace(/\n/g, "<br>")}</div>` : ""}`;
      }).join("")
    : `<div class="empty">${all.length ? t("no_alerts_filter") : t("no_alerts_agent")}</div>`;
  return `<div id="agentAlertsSection"><div class="chart-cat">${t("alerts_title")}</div>${filterBar}${toggleBar}<div class="list">${body}</div></div>`;
}

// Historique unifié des jobs de sauvegarde (Files & Data pour S/W, Microsoft
// 365 pour O) via /api/target/{agent}/backup/activity. Un seul endpoint pour
// les deux familles de produits, avec un vrai statut de job (pas juste
// "installé ou pas").
function backupStatusLabel(status) {
  return {
    success: t("backup_success"),
    error: t("backup_error"),
    warning: t("backup_warning"),
    running: t("backup_running"),
    waiting_first_backup: t("backup_waiting"),
    unknown: t("backup_unknown"),
  }[status];
}

function backupActivityClass(status) {
  if (status === "success") return "success";
  if (status === "error") return "critical";
  if (status === "warning") return "medium";
  return "low"; // running, waiting_first_backup, unknown
}

function pluginLabel(plugin) {
  return {
    file: t("plugin_file"), mssql: t("plugin_mssql"), oracle: t("plugin_oracle"), hyperV: t("plugin_hyperV"),
    bareMetal: t("plugin_bareMetal"), vCenter: t("plugin_vCenter"), replication: t("plugin_replication"),
    exchange: t("plugin_exchange"),
  }[plugin];
}

function backupActivityMeta(a) {
  const parts = [];
  if (Number.isFinite(a.duration)) parts.push(Math.round(a.duration / 60) + t("duration_min"));
  if (Number.isFinite(a.size) && a.size > 0) parts.push(formatBytes(a.size));
  return parts.join(" · ");
}

function backupActivityDetail(a) {
  const parts = [];
  if (a.backupError) parts.push(String(a.backupError).trim());

  let specific = null;
  try { specific = JSON.parse(a.specificData || "null"); } catch (e) { /* pas de JSON exploitable */ }
  if (specific && Array.isArray(specific.logs) && specific.logs.length) {
    parts.push(specific.logs.map((l) => (typeof l === "string" ? l : JSON.stringify(l))).join("\n"));
  }

  const succ = a.objectSuccess, fail = a.objectFailure;
  if ((Number.isFinite(succ) && succ > 0) || (Number.isFinite(fail) && fail > 0)) {
    parts.push(t("objects_summary", { succ: succ ?? 0, fail: fail ?? 0 }));
  }

  return parts.join("\n\n").trim();
}

function backupActivityRowHtml(a, index) {
  const cls = backupActivityClass(a.status);
  const label = backupStatusLabel(a.status) || a.status || "?";
  const meta = backupActivityMeta(a);
  const detail = backupActivityDetail(a);
  const uid = "backup-" + index;
  const title = pluginLabel(a.plugin) || a.plugin || a.product || t("backup_title");

  return `
    <div class="incident ${cls}" ${detail ? `data-uid="${uid}" style="cursor:pointer;"` : `style="cursor:default;"`}>
      <div class="title">${escapeHtml(title)}</div>
      <div class="meta">
        <span class="badge ${cls}">${escapeHtml(label)}</span>
        ${a.product ? `<span>${escapeHtml(a.product)}</span>` : ""}
        <span>${formatDate(a.date)}</span>
        ${meta ? `<span>${escapeHtml(meta)}</span>` : ""}
      </div>
    </div>
    ${detail ? `<div class="chart-panel" id="panel-${uid}" hidden>${escapeHtml(detail).replace(/\n/g, "<br>")}</div>` : ""}
  `;
}

async function renderBackupActivitySection(agentId) {
  try {
    const qs = new URLSearchParams({ sortField: "date", sortWay: "DESC" }).toString();
    const data = await fetchJson(`/api/target/${encodeURIComponent(agentId)}/backup/activity?${qs}`);
    const activities = data.data || [];

    // Le domaine M365 (organization) est porté par chaque activité : on le
    // récupère au passage pour l'afficher dans l'en-tête de la fiche agent.
    const orgName = activities.find((a) => a.organization?.name)?.organization?.name || null;

    // Un job par produit ET par volet, par exécution : on garde le plus récent
    // de chaque combinaison (un même plugin, ex. "file", peut exister sous
    // deux produits différents en parallèle, ex. Files & Data 1.0 et 2.0).
    const latestByKey = new Map();
    for (const a of activities) {
      const key = (a.product || "") + "|" + (a.plugin || "");
      if (!latestByKey.has(key)) latestByKey.set(key, a);
    }

    if (latestByKey.size === 0) return { html: "", orgName }; // aucune sauvegarde détectée : section masquée

    const rows = [...latestByKey.values()].map(backupActivityRowHtml).join("");
    return { html: `<div class="chart-cat">${t("backup_title")}</div><div class="list">${rows}</div>`, orgName };
  } catch (err) {
    return { html: `<div class="chart-cat">${t("backup_title")}</div><div class="error">${t("generic_error_prefix")}${escapeHtml(err.message)}</div>`, orgName: null };
  }
}

// Journaux d'événements Windows (System/Application/SNMP Traps) remontés par
// l'agent. Seuls error/warning sont conservés côté API (pas de bruit
// "information"), donc la criticité se calque directement sur le vocabulaire
// déjà utilisé pour les alertes (critique/moyen/bas).
// "warning" est associé à la classe "low" (jaune) et non "medium" (orange,
// réservé au niveau "Moyenne" des alertes) : Erreur/Avertissement n'ont que 2
// couleurs (rouge/jaune), alors que les alertes en ont 3 (rouge/orange/jaune).
const EVENT_TYPE_CLASS = { error: "critical", warning: "low", information: "low" };
function eventTypeLabel(type) {
  return { error: t("event_error"), warning: t("event_warning"), information: t("event_info") }[type];
}

function eventRowHtml(ev, index) {
  const cls = EVENT_TYPE_CLASS[ev.type] || "low";
  const label = eventTypeLabel(ev.type) || ev.type || "?";
  const uid = "event-" + index;
  return `
    <div class="incident ${cls}" data-uid="${uid}" style="cursor:pointer;">
      <div class="title">${escapeHtml(ev.source || t("event_source_unknown"))}</div>
      <div class="meta">
        <span class="badge ${cls}">${escapeHtml(label)}</span>
        <span>${escapeHtml(ev.logName || "")}</span>
        <span>${formatDate(ev.textDate)}</span>
      </div>
    </div>
    <div class="chart-panel" id="panel-${uid}" hidden>${escapeHtml(ev.text || "").replace(/\n/g, "<br>")}</div>
  `;
}

// Données brutes conservées à part (plutôt que rejetées après le premier
// rendu) pour pouvoir ré-appliquer un filtre sans refaire d'appel API.
let lastAgentEvents = [];
let agentEventFilter = null; // null (Toutes) | "error" | "warning"

function renderAgentEventsBlock() {
  if (lastAgentEvents.length === 0) return ""; // pas d'erreur/avertissement récent : section masquée
  const items = agentEventFilter ? lastAgentEvents.filter((ev) => ev.type === agentEventFilter) : lastAgentEvents;
  const filterBar = miniFilterBarHtml([["", t("filter_all")], ["error", t("event_error")], ["warning", t("event_warning")]], agentEventFilter, "agent-event-filter");
  const toggleBar = items.length
    ? `<div class="mini-filter"><button type="button" class="mini-filter-btn" data-toggle-all-panels="agentEventsSection">${t("show_all")}</button></div>`
    : "";
  const body = items.length ? items.map(eventRowHtml).join("") : `<div class="empty">${t("no_events")}</div>`;
  return `<div id="agentEventsSection"><div class="chart-cat">${t("journal_title")}</div>${filterBar}${toggleBar}<div class="list">${body}</div></div>`;
}

async function renderAgentEventsSection(agentId) {
  try {
    const qs = new URLSearchParams({ maxResults: "20" }).toString();
    const data = await fetchJson(`/api/agent/${encodeURIComponent(agentId)}/event/list?${qs}`);
    lastAgentEvents = Array.isArray(data) ? data : [];
    return renderAgentEventsBlock();
  } catch (err) {
    lastAgentEvents = [];
    return `<div id="agentEventsSection"><div class="chart-cat">${t("journal_title")}</div><div class="error">${t("generic_error_prefix")}${escapeHtml(err.message)}</div></div>`;
  }
}

// Résultats des scripts personnalisés ("Custom scripts") assignés à l'agent
// via /api/agent/{agent}/customscriptresult — un script peut ne jamais avoir
// encore été exécuté (lastResult est alors null). status 1 = succès de
// l'exécution, 2 = échec (avec un message d'erreur), peu importe le résultat
// métier du script lui-même (ex. ExitCode non nul reste un status 1 si le
// script a bien tourné).
function customScriptVarLabel(script, variable) {
  const aliases = script.aliases;
  if (aliases && typeof aliases === "object" && !Array.isArray(aliases) && aliases[variable]) {
    return aliases[variable];
  }
  return variable;
}

function customScriptRowHtml(script, index) {
  const last = script.lastResult;
  const cls = !last ? "low" : last.status === 1 ? "success" : last.status === 2 ? "critical" : "low";
  const label = !last ? t("cs_never_run") : last.status === 1 ? t("cs_success") : last.status === 2 ? t("cs_failure") : t("cs_unknown");
  const uid = "csn-" + index;

  const lines = [];
  if (last) {
    if (last.status === 2 && last.message) lines.push(t("cs_exec_error") + last.message);
    for (const v of script.variables || []) {
      const value = last.data?.[v];
      if (value === undefined || value === "") continue;
      lines.push(customScriptVarLabel(script, v) + " : " + value);
    }
  }
  const detail = lines.join("\n").trim();

  return `
    <div class="incident ${cls}" ${detail ? `data-uid="${uid}" style="cursor:pointer;"` : `style="cursor:default;"`}>
      <div class="title">${escapeHtml(script.name || script.customScriptName || "Script")}</div>
      <div class="meta">
        <span class="badge ${cls}">${escapeHtml(label)}</span>
        <span>${escapeHtml(script.customScriptName || "")}</span>
        <span>${formatDate(last?.createdAt)}</span>
      </div>
    </div>
    ${detail ? `<div class="chart-panel" id="panel-${uid}" hidden>${escapeHtml(detail).replace(/\n/g, "<br>")}</div>` : ""}
  `;
}

async function renderCustomScriptsSection(agentId) {
  try {
    const data = await fetchJson(`/api/agent/${encodeURIComponent(agentId)}/customscriptresult`);
    const scripts = data && !Array.isArray(data) ? Object.values(data) : [];
    if (scripts.length === 0) return ""; // aucun script personnalisé assigné : section masquée

    // Les scripts déjà exécutés en premier (plus récent d'abord), ceux jamais
    // lancés à la fin (triés par nom, pas de date pour les départager).
    scripts.sort((a, b) => {
      const da = a.lastResult?.createdAt, db = b.lastResult?.createdAt;
      if (da && db) return new Date(db) - new Date(da);
      if (da) return -1;
      if (db) return 1;
      return (a.name || "").localeCompare(b.name || "");
    });

    const rows = scripts.map(customScriptRowHtml).join("");
    const toggleBar = `<div class="mini-filter"><button type="button" class="mini-filter-btn" data-toggle-all-panels="agentCustomScriptsSection">${t("show_all")}</button></div>`;
    return `<div id="agentCustomScriptsSection"><div class="chart-cat">Custom scripts</div>${toggleBar}<div class="list">${rows}</div></div>`;
  } catch (err) {
    return `<div id="agentCustomScriptsSection"><div class="chart-cat">Custom scripts</div><div class="error">${t("generic_error_prefix")}${escapeHtml(err.message)}</div></div>`;
  }
}

// Résumé compact du module "Disquette" de RG System (déploiement de
// logiciels tiers/correctifs). La ligne de résumé vient de /status/overview
// (un seul appel léger, totaux par statut) ; la liste détaillée par paquet
// (/disquette/status) n'est chargée qu'au clic — jamais au chargement de la
// fiche — car chaque paquet y porte un `processResult.stdOut` pouvant faire
// plusieurs centaines de Ko (journal d'installation Chocolatey ligne par
// ligne) : seuls les champs utiles (nom, version, statut, date) sont gardés,
// ce journal n'est jamais affiché ni même conservé une fois la réponse lue.
const DEPLOY_PROBLEM_STATUSES = ["OutOfPolicy", "WrongVersion", "ErrorInstallRetrying", "ErrorInstallStopped"];
const DEPLOY_STATUS_CLASS = {
  Installed: "success", InstalledRequired: "success",
  OutOfPolicy: "medium", WrongVersion: "medium",
  ErrorInstallRetrying: "critical", ErrorInstallStopped: "critical",
  InstallPending: "low", UninstallPending: "low", UpdateScheduledIfPresent: "low",
};
const DEPLOY_KNOWN_STATUSES = new Set([
  "InstallPending", "Installed", "InstalledRequired", "OutOfPolicy", "WrongVersion",
  "ErrorInstallRetrying", "ErrorInstallStopped", "UninstallPending", "UpdateScheduledIfPresent",
]);
// Si RG System introduit un jour un nouveau statut pas encore dans la liste
// ci-dessus, on affiche le code brut plutôt qu'une clé de traduction non
// résolue (t() retombe sinon sur la clé elle-même, jamais sur une chaîne vide).
function deployStatusLabel(status) {
  return DEPLOY_KNOWN_STATUSES.has(status) ? t("deploy_status_" + status) : (status || "?");
}

async function renderDeploySummarySection(agentId) {
  try {
    const overview = await fetchJson(`/api/target/${encodeURIComponent(agentId)}/disquette/status/overview`);
    const total = overview.total || 0;
    if (total === 0) return ""; // aucun déploiement configuré sur cet agent : section masquée
    const byStatus = overview.packagesByStatus || {};
    const problemCount = DEPLOY_PROBLEM_STATUSES.reduce((sum, k) => sum + (byStatus[k] || 0), 0);
    const detail = problemCount > 0 ? t("deploy_watch", { count: problemCount }) : t("deploy_up_to_date");
    return `<div class="chart-cat">${t("deploy_title")}</div>` +
      `<button type="button" class="deploy-summary" data-toggle-deploy-list>📦 ${t("deploy_total", { total })} · ${detail} <span class="chev">›</span></button>` +
      `<div class="list" id="agentDeployList" hidden></div>`;
  } catch (err) {
    return ""; // information secondaire : une erreur ici ne doit pas polluer la fiche agent
  }
}

function deployRowHtml(pkg) {
  const cls = DEPLOY_STATUS_CLASS[pkg.status] || "low";
  return `
    <div class="incident ${cls}" style="cursor:default;">
      <div class="title">${escapeHtml(pkg.name || pkg.package || "?")}</div>
      <div class="meta">
        <span class="badge ${cls}">${escapeHtml(deployStatusLabel(pkg.status))}</span>
        ${pkg.version ? `<span>${escapeHtml(pkg.version)}</span>` : ""}
        <span>${formatDate(pkg.statusSince)}</span>
      </div>
    </div>`;
}

async function toggleDeployList() {
  const list = document.getElementById("agentDeployList");
  if (!list) return;
  if (!list.hidden) { list.hidden = true; return; }
  list.hidden = false;
  if (list.dataset.loaded) return;
  list.innerHTML = `<div class="loading">${t("loading")}</div>`;
  try {
    const data = await fetchJson(`/api/target/${encodeURIComponent(currentAgentId)}/disquette/status`);
    const packages = (data.data || []).slice().sort((a, b) => new Date(b.statusSince) - new Date(a.statusSince));
    list.innerHTML = packages.map(deployRowHtml).join("");
    list.dataset.loaded = "1";
  } catch (err) {
    list.innerHTML = `<div class="error">${t("generic_error_prefix")}${escapeHtml(err.message)}</div>`;
  }
}

let currentAgentId = null;

async function loadAgent(agentId) {
  currentAgentId = agentId;
  agentAlertFilter = null;
  agentEventFilter = null;
  lastAgentEvents = [];
  agentTitleEl.textContent = t("agent_default_title");
  agentBreadcrumbEl.hidden = true;
  agentBodyEl.innerHTML = `<div class="loading">${t("loading")}</div>`;
  try {
    const [ped, objects] = await Promise.all([
      fetchJson(`/api/agent/${encodeURIComponent(agentId)}`),
      fetchJson(`/api/agent/${encodeURIComponent(agentId)}/objects`).catch(() => ({})),
    ]);
    if (ped.nodeId != null) renderBreadcrumb(agentBreadcrumbEl, ped.nodeId, { includeSelf: true });

    // Type "L" (lien/agent léger) n'a ni courbes de supervision exploitables,
    // ni journal d'événements Windows, ni alertes pertinentes : on masque ces
    // trois blocs plutôt que d'afficher des sections vides.
    const showSupervisionBlocks = ped.type !== "L";

    const categories = showSupervisionBlocks ? collectChartables(objects) : [];
    const chartsHtml = !showSupervisionBlocks ? "" : categories.length
      ? `<div class="chart-cat">${t("charts_title")}</div>` +
        `<div class="mini-filter"><button type="button" class="mini-filter-btn" data-charts-toggle-all>${t("show_all")}</button></div>` +
        `<div id="agentChartsList">${categories.map((cat) => cat.items.map((item) => chartItemHtml(item, cat.name)).join("")).join("")}</div>`
      : `<div class="empty">${t("no_charts")}</div>`;

    const backupPromise = ["S", "W", "O"].includes(ped.type)
      ? renderBackupActivitySection(agentId)
      : Promise.resolve({ html: "", orgName: null });
    const eventsPromise = showSupervisionBlocks ? renderAgentEventsSection(agentId) : Promise.resolve("");
    const customScriptsPromise = ["S", "W"].includes(ped.type)
      ? renderCustomScriptsSection(agentId)
      : Promise.resolve("");
    const deployPromise = ["S", "W"].includes(ped.type)
      ? renderDeploySummarySection(agentId)
      : Promise.resolve("");
    const [backupResult, eventsHtml, customScriptsHtml, deployHtml] = await Promise.all([backupPromise, eventsPromise, customScriptsPromise, deployPromise]);
    const { html: backupHtml, orgName } = backupResult;

    const incidentsHtml = showSupervisionBlocks ? renderAgentIncidents(agentId) : "";
    agentBodyEl.innerHTML = renderAgentPedigree(agentId, ped, orgName) + backupHtml + deployHtml + chartsHtml + incidentsHtml + eventsHtml + customScriptsHtml;
  } catch (err) {
    agentBodyEl.innerHTML = '<div class="error">' + t("error_prefix") + escapeHtml(err.message) + '</div>';
    console.error(err);
  }
}

agentBodyEl.addEventListener("click", (e) => {
  const deployToggleBtn = e.target.closest("[data-toggle-deploy-list]");
  if (deployToggleBtn) {
    toggleDeployList();
    return;
  }
  const expandAllBtn = e.target.closest("[data-charts-toggle-all]");
  if (expandAllBtn) {
    const list = document.getElementById("agentChartsList");
    const toggles = list ? [...list.querySelectorAll(".chart-toggle")] : [];
    const anyCollapsed = toggles.some((t) => document.getElementById("panel-" + t.dataset.uid)?.hidden);
    toggles.forEach((t) => {
      const panel = document.getElementById("panel-" + t.dataset.uid);
      if (!panel) return;
      if (anyCollapsed) {
        if (panel.hidden) {
          panel.hidden = false;
          if (t.dataset.obj) loadChart(panel, t.dataset.obj, t.dataset.chart, t.dataset.counters, "week");
        }
      } else {
        panel.hidden = true;
      }
    });
    expandAllBtn.textContent = anyCollapsed ? t("collapse_all") : t("show_all");
    return;
  }

  // Bascule générique "Tout afficher/replier" pour les blocs dont les
  // éléments sont des `.incident[data-uid]` classiques (Alertes, Journal
  // d'événements, Custom scripts) — contrairement aux courbes (ci-dessus),
  // ces panneaux n'ont rien à charger à l'ouverture, un simple hidden suffit.
  const toggleAllPanelsBtn = e.target.closest("[data-toggle-all-panels]");
  if (toggleAllPanelsBtn) {
    const container = document.getElementById(toggleAllPanelsBtn.dataset.toggleAllPanels);
    const panels = container
      ? [...container.querySelectorAll(".incident[data-uid]")].map((it) => document.getElementById("panel-" + it.dataset.uid)).filter(Boolean)
      : [];
    const anyCollapsed = panels.some((p) => p.hidden);
    panels.forEach((p) => { p.hidden = !anyCollapsed; });
    toggleAllPanelsBtn.textContent = anyCollapsed ? t("collapse_all") : t("show_all");
    return;
  }

  const alertFilterBtn = e.target.closest("[data-agent-alert-filter]");
  if (alertFilterBtn) {
    agentAlertFilter = alertFilterBtn.dataset.agentAlertFilter || null;
    const section = document.getElementById("agentAlertsSection");
    if (section) section.outerHTML = renderAgentIncidents(currentAgentId);
    return;
  }

  const eventFilterBtn = e.target.closest("[data-agent-event-filter]");
  if (eventFilterBtn) {
    agentEventFilter = eventFilterBtn.dataset.agentEventFilter || null;
    const section = document.getElementById("agentEventsSection");
    if (section) section.outerHTML = renderAgentEventsBlock();
    return;
  }

  const incident = e.target.closest(".incident[data-uid]");
  if (incident) {
    const panel = document.getElementById("panel-" + incident.dataset.uid);
    if (panel) panel.hidden = !panel.hidden;
    return;
  }

  const btn = e.target.closest(".chart-toggle");
  if (!btn) return;
  const panel = document.getElementById("panel-" + btn.dataset.uid);
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.hidden = false;
  // Le panneau "commentaire" n'a pas de graphique associé, juste du texte déjà en place.
  if (btn.dataset.obj) {
    loadChart(panel, btn.dataset.obj, btn.dataset.chart, btn.dataset.counters, "week");
  }
});

function scaleSelectorHtml(scale) {
  return `
    <div class="scale-selector">
      ${["day", "week", "month", "year"].map((s) => `<button data-scale="${s}" class="${s === scale ? "active" : ""}">${scaleLabel(s)}</button>`).join("")}
    </div>
    <div class="chart-host"><div class="loading">${t("loading")}</div></div>
  `;
}

// Ces compteurs ne prennent jamais que deux valeurs (0 ou 1) : un graphique
// en ligne classique n'est pas lisible pour ça, on affiche une barre d'état.
const BOOLEAN_COUNTERS = new Set(["Alive", "AvActive", "AvUpToDate"]);

async function loadChart(panel, objId, chartId, counters, scale) {
  panel.innerHTML = scaleSelectorHtml(scale);
  panel.querySelectorAll(".scale-selector button").forEach((b) => {
    b.addEventListener("click", () => loadChart(panel, objId, chartId, counters, b.dataset.scale));
  });

  const host = panel.querySelector(".chart-host");
  try {
    const data = await fetchJson(`/api/chart/data/${objId}/${chartId}/${scale}`);
    if (BOOLEAN_COUNTERS.has(counters)) {
      host.innerHTML = buildStatusBarSvg(data[counters] || [], scale);
    } else {
      const interpreted = interpretChartData(counters, data);
      host.innerHTML = buildLineChartSvg(interpreted, scale);
    }
  } catch (err) {
    host.innerHTML = '<div class="error">' + t("generic_error_prefix") + escapeHtml(err.message) + '</div>';
  }
}

function buildStatusBarSvg(values, scale) {
  if (!values.length) return `<div class="empty">${t("chart_no_data")}</div>`;

  const W = 300, H = 50, padL = 2, padR = 2, padT = 2, padB = 2;
  const n = values.length;
  const barW = (W - padL - padR) / n;
  const bars = values.map((v, i) => {
    const active = v >= 0.5;
    const x = padL + i * barW;
    return `<rect x="${x.toFixed(2)}" y="${padT}" width="${Math.max(barW - 0.3, 0.5).toFixed(2)}" height="${H - padT - padB}" fill="${active ? "#5aa06a" : "#c9615f"}" />`;
  }).join("");
  const activeCount = values.filter((v) => v >= 0.5).length;
  const pct = ((activeCount / n) * 100).toFixed(1);

  return `
    <div class="chart-meta">${t("chart_active_pct", { pct, scale: scaleLabel(scale) || scale })}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${bars}</svg>
  `;
}

function interpretChartData(counters, data) {
  const keys = counters.split(" ").filter(Boolean);

  if (keys.length === 2) {
    const totalKey = keys.find((k) => /Size$/i.test(k));
    const usedKey = keys.find((k) => k !== totalKey);
    if (totalKey && usedKey && Array.isArray(data[totalKey]) && Array.isArray(data[usedKey])) {
      const values = data[usedKey].map((v, i) => {
        const total = data[totalKey][i];
        return total ? (v / total) * 100 : 0;
      });
      // Tendance affichée uniquement pour Disque/Mémoire (branche "utilisation
      // sur capacité"), pas pour les compteurs bruts (CPU, réseau...).
      return { unit: "%", series: [{ name: t("series_usage"), values }], showTrend: true };
    }
  }

  const series = keys.filter((k) => Array.isArray(data[k])).map((k) => ({ name: k, values: data[k] }));
  if (series.length === 0) return { unit: "", series: [] };

  const flat = series.flatMap((s) => s.values).filter(Number.isFinite);
  const looksLikePercent = series.length === 1 && flat.length > 0 && Math.max(...flat) <= 100.0001;
  return { unit: looksLikePercent ? "%" : "", series };
}

function clampNum(v, min, max) {
  if (!Number.isFinite(v)) return min;
  return Math.min(max, Math.max(min, v));
}

function formatBytes(n) {
  if (!Number.isFinite(n)) return "–";
  if (Math.abs(n) < 1024) return n.toFixed(0);
  const units = ["Ko", "Mo", "Go", "To"];
  let v = n, i = -1;
  do { v /= 1024; i++; } while (Math.abs(v) >= 1024 && i < units.length - 1);
  return v.toFixed(1) + " " + units[i];
}

function formatValue(v, unit) {
  if (!Number.isFinite(v)) return "–";
  return unit === "%" ? v.toFixed(1) + " %" : formatBytes(v);
}

// Régression linéaire simple (moindres carrés) sur une série de valeurs
// régulièrement espacées, pour tracer une tendance générale.
function computeTrend(values) {
  const pts = values.map((v, i) => [i, v]).filter(([, v]) => Number.isFinite(v));
  if (pts.length < 2) return null;
  const n = pts.length;
  const sumX = pts.reduce((s, [x]) => s + x, 0);
  const sumY = pts.reduce((s, [, y]) => s + y, 0);
  const sumXY = pts.reduce((s, [x, y]) => s + x * y, 0);
  const sumXX = pts.reduce((s, [x]) => s + x * x, 0);
  const denom = n * sumXX - sumX * sumX;
  if (denom === 0) return null;
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  return { slope, intercept };
}

function buildLineChartSvg(interpreted, scale) {
  const { unit, series, showTrend } = interpreted;
  if (!series.length || series.every((s) => s.values.length === 0)) {
    return `<div class="empty">${t("chart_no_data")}</div>`;
  }

  const W = 300, H = 140, padL = 38, padR = 10, padT = 10, padB = 10;
  const flat = series.flatMap((s) => s.values).filter(Number.isFinite);
  let min = Math.min(...flat);
  let max = Math.max(...flat);

  if (unit === "%") { min = 0; max = 100; }
  else {
    if (min > 0) min = 0;
    max = max === min ? min + 1 : max + (max - min) * 0.1;
  }

  const colors = ["#2e3862", "#65d5c5", "#ff6136"];

  const paths = series.map((s, idx) => {
    const n = s.values.length;
    const points = s.values.map((v, i) => {
      const x = padL + (n > 1 ? i / (n - 1) : 0) * (W - padL - padR);
      const y = padT + (1 - (clampNum(v, min, max) - min) / ((max - min) || 1)) * (H - padT - padB);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return `<polyline points="${points}" fill="none" stroke="${colors[idx % colors.length]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />`;
  }).join("");

  let trendLine = "";
  if (showTrend) {
    const trend = computeTrend(series[0].values);
    if (trend) {
      const n = series[0].values.length;
      const y0 = clampNum(trend.intercept, min, max);
      const y1 = clampNum(trend.slope * (n - 1) + trend.intercept, min, max);
      const yy0 = padT + (1 - (y0 - min) / ((max - min) || 1)) * (H - padT - padB);
      const yy1 = padT + (1 - (y1 - min) / ((max - min) || 1)) * (H - padT - padB);
      trendLine = `<line x1="${padL}" y1="${yy0.toFixed(1)}" x2="${W - padR}" y2="${yy1.toFixed(1)}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.55" />`;
    }
  }

  // Lues au moment du rendu (pas codées en dur) pour que les courbes suivent
  // le thème clair/sombre courant sans logique supplémentaire ici.
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue("--card-border").trim();
  const axisTextColor = getComputedStyle(document.documentElement).getPropertyValue("--text-dim").trim();
  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + f * (H - padT - padB);
    const val = max - f * (max - min);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="${gridColor}" stroke-width="1" />
      <text x="${(padL - 4).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="${axisTextColor}">${formatValue(val, unit)}</text>`;
  }).join("");

  const legend = series.length > 1
    ? `<div class="chart-legend">${series.map((s, i) => `<span class="legend-item"><i style="background:${colors[i % colors.length]}"></i>${escapeHtml(s.name)}</span>`).join("")}</div>`
    : "";

  const latest = series[0].values[series[0].values.length - 1];

  return `
    <div class="chart-meta">${t("chart_latest_value", { value: formatValue(latest, unit), scale: scaleLabel(scale) || scale })}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${gridLines}${trendLine}${paths}</svg>
    ${legend}
  `;
}

// RELEASE_NOTES est trié du plus récent au plus ancien : on ne garde que les
// 5 dernières versions pour que cet écran reste court à parcourir.
const WHATS_NEW_LIMIT = 5;

// `n.text` est soit une chaîne simple (anciennes entrées, toujours en
// français), soit un objet {fr, en, de, it, es, pt} (entrées récentes) — dans
// ce second cas, on prend la langue courante, avec repli sur le français si
// jamais une traduction venait à manquer pour cette entrée précise.
function releaseNoteText(n) {
  if (typeof n.text === "string") return n.text;
  return n.text[currentLang] || n.text.fr;
}

function renderWhatsNew() {
  const list = document.getElementById("whatsNewList");
  list.innerHTML = RELEASE_NOTES.slice(0, WHATS_NEW_LIMIT).map((n) => `
    <div class="note-item">
      <div class="version">v${escapeHtml(n.version)}</div>
      <div class="text">${escapeHtml(releaseNoteText(n))}</div>
    </div>
  `).join("");
}

// Point rouge sur "Nouveautés" tant que la dernière version publiée n'a pas
// été consultée. La version "vue" est mémorisée dans localStorage (pas de
// compte utilisateur dans cette appli, donc pas d'autre endroit où la garder).
const LAST_SEEN_VERSION_KEY = "rgdash-last-seen-version";
const whatsNewDotEl = document.getElementById("whatsNewDot");

function updateWhatsNewDot() {
  let lastSeen = null;
  try { lastSeen = localStorage.getItem(LAST_SEEN_VERSION_KEY); } catch (e) { /* stockage indisponible : pas de point rouge, pas bloquant */ }
  whatsNewDotEl.hidden = lastSeen === null || lastSeen === RELEASE_NOTES[0].version;
}

function markWhatsNewSeen() {
  try { localStorage.setItem(LAST_SEEN_VERSION_KEY, RELEASE_NOTES[0].version); } catch (e) { /* pas bloquant */ }
  updateWhatsNewDot();
}

// Première utilisation de ce suivi (avant cette version, rien n'était
// mémorisé) : on part du principe que la version actuelle est déjà "vue"
// plutôt que d'afficher un point rouge dès l'installation de cette fonctionnalité.
try {
  if (localStorage.getItem(LAST_SEEN_VERSION_KEY) === null) {
    localStorage.setItem(LAST_SEEN_VERSION_KEY, RELEASE_NOTES[0].version);
  }
} catch (e) { /* stockage indisponible : le point restera simplement toujours masqué */ }
updateWhatsNewDot();

   Page Carte (clients géolocalisés via OpenStreetMap/Leaflet)
   ========================================================= */

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

// Pin rouge (couleur alignée sur --crit-critical) pour un client ayant au
// moins une alerte critique active, à la place du pin bleu par défaut de
// Leaflet, construit une seule fois au premier besoin.
let criticalMarkerIcon = null;
function getCriticalMarkerIcon() {
  if (!criticalMarkerIcon) {
    criticalMarkerIcon = L.divIcon({
      className: "",
      html: `<svg width="25" height="41" viewBox="0 0 25 41" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.5 0C5.6 0 0 5.6 0 12.5c0 9.4 12.5 28.5 12.5 28.5S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0z" fill="#ef4444"/>
        <circle cx="12.5" cy="12.5" r="5" fill="#fff"/>
      </svg>`,
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
    });
  }
  return criticalMarkerIcon;
}

// Géocodage gratuit via Nominatim (OpenStreetMap) : pas de clé API, mais
// limité à 1 requête/seconde et à utiliser avec parcimonie. Les résultats
// sont mis en cache dans le navigateur (une adresse d'entreprise change
// rarement) pour ne géocoder chaque client qu'une seule fois.
async function geocodeAddress(address) {
  const cacheKey = "rgdash-geocode:" + address;
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) return { point: JSON.parse(cached), cached: true };
  } catch (e) { /* stockage indisponible : on re-géocode simplement */ }

  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(address);
  const res = await fetch(url);
  if (!res.ok) throw new Error(t("geocoding_unavailable", { status: res.status }));
  const results = await res.json();
  if (!results.length) return { point: null, cached: false };
  const point = { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
  try { localStorage.setItem(cacheKey, JSON.stringify(point)); } catch (e) { /* pas bloquant */ }
  return { point, cached: false };
}

// Exécute `items` via `fn` avec au plus `limit` appels en parallèle.
async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

let mapInstance = null;
let mapLoaded = false; // évite de re-géocoder à chaque retour sur la page

function renderUnlocatedClients(unlocated) {
  const el = document.getElementById("mapUnlocated");
  if (unlocated.length === 0) { el.hidden = true; return; }
  const rows = unlocated.map((c) => `
    <div class="note-item">
      <div class="version">${escapeHtml(c.name)}</div>
      <div class="text">${escapeHtml(c.reason)} — <a href="#/parc/node/${encodeURIComponent(c.id)}">${t("map_see_client")}</a></div>
    </div>
  `).join("");
  el.innerHTML = `<div class="chart-cat">${t("map_unlocated", { n: unlocated.length })}</div><div class="list">${rows}</div>`;
  el.hidden = false;
}

async function loadMapPage() {
  const statusEl = document.getElementById("mapStatus");
  const containerEl = document.getElementById("mapContainer");
  const unlocatedEl = document.getElementById("mapUnlocated");

  if (mapLoaded) {
    statusEl.hidden = true;
    containerEl.style.display = "block";
    if (mapInstance) setTimeout(() => mapInstance.invalidateSize(), 0);
    return;
  }

  statusEl.hidden = false;
  statusEl.textContent = t("map_loading_clients");
  containerEl.style.display = "none";
  unlocatedEl.hidden = true;

  try {
    // On rafraîchit aussi les alertes (pas seulement les agents) : c'est ce
    // qui permet de savoir quel client a au moins un ticket critique en cours,
    // pour colorer son épingle en rouge sur la carte.
    const [agents] = await Promise.all([loadAllAgents(), loadAlerts()]);
    const criticalAgentIds = new Set(
      lastIncidents.filter((inc) => !inc.acquitted && inc.criticality === "critical").map((inc) => inc.agentId)
    );

    const customers = new Map();
    for (const a of agents) {
      if (!a.customer?.id) continue;
      if (!customers.has(a.customer.id)) {
        customers.set(a.customer.id, { id: a.customer.id, name: a.customer.name, hasCritical: false });
      }
      if (criticalAgentIds.has(a.agentId)) {
        customers.get(a.customer.id).hasCritical = true;
      }
    }

    if (customers.size === 0) {
      statusEl.textContent = t("map_no_clients");
      return;
    }

    const pins = [];
    // On garde une trace des clients qu'on n'arrive pas à placer sur la carte
    // (adresse absente ou non reconnue par le géocodeur) : sans ça, un client
    // disparaît silencieusement de la carte sans que personne ne s'en aperçoive.
    const unlocated = [];

    // Étape 1 : récupérer les fiches client (nom, adresse) en parallèle — ces
    // appels passent par notre propre relais et ne sont pas soumis à la limite
    // de Nominatim, inutile de les faire un par un.
    statusEl.textContent = t("map_fetching_details", { i: 0, n: customers.size });
    let fetched = 0;
    const customerList = Array.from(customers.values());
    const detailsList = await mapLimit(customerList, 5, async (customer) => {
      try {
        const details = await fetchJson(`/api/node/${encodeURIComponent(customer.id)}/customer`);
        fetched++;
        statusEl.textContent = t("map_fetching_details", { i: fetched, n: customers.size });
        return { customer, details, error: null };
      } catch (err) {
        fetched++;
        console.error("Client " + customer.id + " :", err);
        return { customer, details: null, error: err };
      }
    });

    // Étape 2 : géocoder chaque adresse. Nominatim impose 1 requête/seconde,
    // mais on ne fait vraiment cette pause que quand on interroge Nominatim —
    // une adresse déjà en cache est traitée immédiatement.
    let i = 0;
    for (const { customer, details, error } of detailsList) {
      i++;
      if (error) {
        unlocated.push({ id: customer.id, name: customer.name, reason: t("map_error_prefix") + error.message });
        continue;
      }
      const name = details.companyName || customer.name;
      if (!details.companyAddress) {
        unlocated.push({ id: customer.id, name, reason: t("map_reason_no_address") });
        continue;
      }
      statusEl.textContent = t("map_locating", { i, n: detailsList.length });
      try {
        const { point, cached } = await geocodeAddress(details.companyAddress);
        if (point) {
          pins.push({ ...point, name, address: details.companyAddress, nodeId: customer.id, hasCritical: customer.hasCritical });
        } else {
          unlocated.push({ id: customer.id, name, reason: t("map_reason_bad_address", { addr: details.companyAddress }) });
        }
        if (!cached) await sleep(1000); // politique d'usage Nominatim : 1 requête/seconde max
      } catch (err) {
        unlocated.push({ id: customer.id, name, reason: t("map_error_prefix") + err.message });
        console.error("Client " + customer.id + " :", err);
      }
    }

    renderUnlocatedClients(unlocated);

    if (pins.length === 0) {
      statusEl.textContent = t("map_none_located");
      return;
    }

    statusEl.hidden = true;
    containerEl.style.display = "block";

    mapInstance = L.map(containerEl);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(mapInstance);

    const markers = pins.map((pin) => {
      const marker = L.marker([pin.lat, pin.lng], pin.hasCritical ? { icon: getCriticalMarkerIcon() } : {}).addTo(mapInstance);
      marker.bindPopup(
        `<strong>${escapeHtml(pin.name)}</strong><br>${escapeHtml(pin.address)}<br>` +
        (pin.hasCritical ? `<span style="color:#ef4444;font-weight:600;">${t("map_critical_popup")}</span><br>` : "") +
        `<a href="#/parc/node/${encodeURIComponent(pin.nodeId)}">${t("map_link_parc")}</a>` +
        (pin.hasCritical ? ` · <a href="#/alerts/client/${encodeURIComponent(pin.nodeId)}">${t("map_link_alerts")}</a>` : "") +
        ` · <a href="#/clients/${encodeURIComponent(pin.nodeId)}">${t("map_link_client_sheet")}</a>`
      );
      return marker;
    });

    if (markers.length > 1) {
      mapInstance.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
    } else {
      mapInstance.setView([pins[0].lat, pins[0].lng], 13);
    }

    mapLoaded = true;
  } catch (err) {
    statusEl.hidden = false;
    statusEl.textContent = t("generic_error_prefix") + err.message;
    console.error(err);
  }
}

async function refreshMap() {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapLoaded = false;
  // On force aussi le rafraîchissement de la liste des agents/clients (cache
  // partagé avec la recherche) : un nouveau client ajouté depuis la dernière
  // ouverture de la carte doit apparaître sans recharger toute la page.
  allAgentsCache = null;
  allAgentsPromise = null;
  await loadMapPage();
}
document.getElementById("mapRefreshBtn").addEventListener("click", () => refreshMap());

// Un seul point d'entrée pour "actualiser la page actuelle", utilisé par les
// boutons ↻ de chaque écran ET par le geste de tirage tactile (pull-to-refresh)
// plus bas — les deux déclenchent toujours exactement la même action.
async function refreshCurrentPage() {
  if (currentPage === "alerts") {
    await loadAlerts();
  } else if (currentPage === "map") {
    await refreshMap();
  } else if (currentPage === "parc") {
    if (!parcAgentView.hidden) {
      if (currentAgentId != null) await loadAgent(currentAgentId);
    } else if (!parcTreeView.hidden) {
      if (currentTreeNodeId != null) {
        allAgentsCache = null;
        allAgentsPromise = null;
        await loadNode(currentTreeNodeId);
      }
    }
    // Vue "Résultats de recherche" : rien de dédié à rafraîchir.
  }
  // Page "Nouveautés" : contenu statique, rien à recharger.
}

/* =========================================================
   Page Clients (annuaire : téléphone, email, adresse cliquables)
   ========================================================= */

const clientsListEl = document.getElementById("clientsList");
const clientsListView = document.getElementById("clientsListView");
const clientsDetailView = document.getElementById("clientsDetailView");
const clientsDetailTitleEl = document.getElementById("clientsDetailTitle");
const clientsDetailBodyEl = document.getElementById("clientsDetailBody");
document.getElementById("clientsBackBtn").addEventListener("click", () => history.back());

// Pas de cache dédié : loadAllAgents() est déjà mise en cache, recalculer la
// liste des clients à partir d'elle est quasi gratuit (pas de nouvel appel API).
async function getClientsList() {
  const agents = await loadAllAgents();
  const byId = new Map();
  for (const a of agents) {
    if (a.customer?.id && !byId.has(a.customer.id)) {
      byId.set(a.customer.id, { id: a.customer.id, name: a.customer.name || t("client_no_name") });
    }
  }
  return [...byId.values()].sort((a, b) => a.name.localeCompare(b.name, "fr"));
}

async function loadClientsList() {
  clientsListView.hidden = false;
  clientsDetailView.hidden = true;
  clientsListEl.innerHTML = `<div class="loading">${t("loading")}</div>`;
  try {
    const clients = await getClientsList();
    if (clients.length === 0) {
      clientsListEl.innerHTML = `<div class="empty">${t("no_clients_found")}</div>`;
      return;
    }
    clientsListEl.innerHTML = clients.map((c) => `
      <div class="incident" style="border-left-color: var(--card-border);" data-client-id="${escapeHtml(c.id)}">
        <div class="title">🏢 ${escapeHtml(c.name)}</div>
      </div>
    `).join("");
  } catch (err) {
    clientsListEl.innerHTML = '<div class="error">' + t("error_prefix") + escapeHtml(err.message) + '</div>';
    console.error(err);
  }
}

clientsListEl.addEventListener("click", (e) => {
  const row = e.target.closest("[data-client-id]");
  if (row) location.hash = "#/clients/" + encodeURIComponent(row.dataset.clientId);
});

// Lien Google Maps (fonctionne aussi bien sur iPhone qu'Android, avec ou sans
// l'appli Google Maps installée — contrairement à un lien geo: non géré par Safari).
function mapsSearchUrl(address) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address);
}

async function loadClientDetail(nodeId) {
  clientsListView.hidden = true;
  clientsDetailView.hidden = false;
  clientsDetailTitleEl.textContent = t("client_default_title");
  clientsDetailBodyEl.innerHTML = `<div class="loading">${t("loading")}</div>`;
  try {
    const details = await fetchJson(`/api/node/${encodeURIComponent(nodeId)}/customer`);
    const name = details.companyName || details.name || t("client_default_title");
    clientsDetailTitleEl.textContent = name;

    const rows = [
      [t("client_phone"), details.companyPhone, (v) => `<a href="tel:${escapeHtml(v.replace(/\s+/g, ""))}">${escapeHtml(v)}</a>`],
      [t("client_email"), details.companyEmail, (v) => `<a href="mailto:${escapeHtml(v)}">${escapeHtml(v)}</a>`],
      [t("client_address"), details.companyAddress, (v) => `<a href="${mapsSearchUrl(v)}" target="_blank" rel="noopener">${escapeHtml(v)}</a>`],
    ].map(([label, value, link]) => `<dt>${label}</dt><dd>${value ? link(value) : "–"}</dd>`).join("");

    clientsDetailBodyEl.innerHTML = `
      <div class="agent-card">
        <h2>🏢 ${escapeHtml(name)}</h2>
        <dl class="kv">${rows}</dl>
        <div style="margin-top: 10px;">
          <a href="#/parc/node/${encodeURIComponent(nodeId)}">${t("client_see_in_parc")}</a>
        </div>
      </div>
    `;
  } catch (err) {
    clientsDetailBodyEl.innerHTML = '<div class="error">' + t("error_prefix") + escapeHtml(err.message) + '</div>';
    console.error(err);
  }
}

/* =========================================================
   Routeur (hash-based)
   ========================================================= */

const pageAlerts = document.getElementById("page-alerts");
const pageParc = document.getElementById("page-parc");
const pageMap = document.getElementById("page-map");
const pageClients = document.getElementById("page-clients");
const pageWhatsNew = document.getElementById("page-whatsnew");
const parcTreeView = document.getElementById("parcTreeView");
const parcAgentView = document.getElementById("parcAgentView");
const searchBarWrap = document.getElementById("searchBarWrap");

function parseHash() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/parc\/agent\/(.+)$/))) return { page: "parc", view: "agent", agentId: decodeURIComponent(m[1]) };
  if ((m = h.match(/^#\/parc\/node\/(.+)$/))) return { page: "parc", view: "tree", nodeId: decodeURIComponent(m[1]) };
  // Lien "Voir les alertes" depuis la carte : ouvre Alertes déjà filtré sur ce client.
  if ((m = h.match(/^#\/alerts\/client\/(.+)$/))) return { page: "alerts", clientId: decodeURIComponent(m[1]) };
  if ((m = h.match(/^#\/clients\/(.+)$/))) return { page: "clients", clientId: decodeURIComponent(m[1]) };
  if (h === "#/clients") return { page: "clients" };
  if (h === "#/alerts") return { page: "alerts" };
  if (h === "#/map") return { page: "map" };
  if (h === "#/whatsnew") return { page: "whatsnew" };
  return { page: "parc", view: "tree", nodeId: ROOT_NODE_ID }; // Parc = page par defaut
}

function router() {
  const r = parseHash();
  currentPage = r.page;

  pageAlerts.hidden = currentPage !== "alerts";
  pageParc.hidden = currentPage !== "parc";
  pageMap.hidden = currentPage !== "map";
  pageClients.hidden = currentPage !== "clients";
  pageWhatsNew.hidden = currentPage !== "whatsnew";
  // Le bouton 🔍 reste toujours visible (même sur Carte/Nouveautés) : cliquer
  // dessus bascule sur Parc avant d'ouvrir la recherche (cf. searchToggleBtn).
  // La hauteur de l'en-tête change d'une page à l'autre (barre de recherche
  // masquée sur Carte/Nouveautés) : on recalcule les décalages "sticky" à
  // chaque navigation plutôt que seulement une fois au chargement.
  updateStickyOffsets();

  if (currentPage === "alerts") {
    if (r.clientId !== undefined) {
      activeClientFilter = r.clientId;
      alertClientFilterEl.value = r.clientId; // ignoré silencieusement si l'option n'existe pas (encore)
    }
    renderAlertList();
    return;
  }
  if (currentPage === "map") {
    loadMapPage();
    return;
  }
  if (currentPage === "clients") {
    if (r.clientId !== undefined) loadClientDetail(r.clientId);
    else loadClientsList();
    return;
  }
  if (currentPage === "whatsnew") {
    renderWhatsNew();
    markWhatsNewSeen();
    return;
  }

  updateParcVisibility();
  if (searchQuery.trim().length >= 2) {
    renderParcSearch();
    return;
  }

  const onAgent = r.view === "agent";
  if (onAgent) loadAgent(r.agentId);
  else loadNode(r.nodeId);
}

window.addEventListener("hashchange", router);

document.getElementById("homeLink").addEventListener("click", () => {
  searchQuery = "";
  searchInputEl.value = "";
  location.hash = "#/parc";
});

// Empile les bandeaux .parc-header / .client-stats juste sous l'en-tête
// global pendant le défilement (position: sticky). La hauteur de l'en-tête
// n'est pas fixe (recherche repliée/dépliée, zone sûre iOS variable selon
// l'appareil) : on la mesure en JS plutôt que de la deviner en CSS.
const appHeaderEl = document.querySelector("header");
function applyStickyOffsets() {
  // Arrondi vers le haut (jamais vers le bas) : sur les écrans haute densité
  // (iPhone), une hauteur mesurée avec décimale (ex. 65.2px) peut être
  // arrondie différemment par le moteur de rendu pour l'élément sticky que
  // pour le contenu juste en dessous, créant un chevauchement d'1px. Arrondir
  // systématiquement vers le haut garantit qu'on ne sous-estime jamais
  // l'espace réservé (au pire un pixel de trop, jamais un chevauchement).
  const headerH = Math.ceil(appHeaderEl.offsetHeight);
  document.querySelectorAll(".parc-header").forEach((ph) => {
    ph.style.top = headerH + "px";
  });
  document.querySelectorAll(".client-stats").forEach((cs) => {
    const ph = cs.previousElementSibling;
    const phH = ph && ph.classList.contains("parc-header") ? Math.ceil(ph.offsetHeight) : 0;
    cs.style.top = (headerH + phH) + "px";
  });
}
function updateStickyOffsets() {
  applyStickyOffsets();
  // Filet de sécurité pour un bug connu de Safari iOS : un élément sticky ne
  // reprend pas toujours sa bonne position (chevauchement avec le contenu
  // suivant) quand la hauteur du contenu au-dessus change par script plutôt
  // que par un vrai scroll utilisateur. On refait le calcul juste après le
  // prochain repaint, une fois les hauteurs définitivement stables.
  requestAnimationFrame(applyStickyOffsets);
}
window.addEventListener("resize", updateStickyOffsets);
if (window.ResizeObserver) new ResizeObserver(updateStickyOffsets).observe(appHeaderEl);

/* =========================================================
   Tirer vers le bas pour actualiser (pull-to-refresh tactile)
   ========================================================= */

const PULL_TRIGGER = 60; // distance (px) au-delà de laquelle relâcher déclenche l'actualisation
const PULL_MAX = 80;
const pullIndicatorWrap = document.getElementById("pullIndicatorWrap");
const pullIndicatorEl = document.getElementById("pullIndicator");
let pullStartY = null;
let pullActive = false;
let pullRefreshing = false;

function pullEligible(target) {
  // Uniquement quand la page est déjà tout en haut (sinon c'est un scroll
  // normal), pas pendant une actualisation déjà en cours, pas quand le tiroir
  // ou la recherche sont ouverts (on ne veut pas interférer avec ces gestes),
  // et pas sur la carte (Leaflet gère déjà ses propres gestes de pan/zoom).
  return (
    window.scrollY <= 0 &&
    !pullRefreshing &&
    mainDrawer.hidden &&
    searchInputRow.hidden &&
    !(target && target.closest && target.closest("#mapContainer"))
  );
}

document.addEventListener("touchstart", (e) => {
  // Un pincement à deux doigts (zoom sur la carte) ne doit jamais être
  // interprété comme un tirage vers le bas.
  pullStartY = (e.touches.length === 1 && pullEligible(e.target)) ? e.touches[0].clientY : null;
  pullActive = false;
}, { passive: true });

document.addEventListener("touchmove", (e) => {
  if (pullStartY == null || pullRefreshing) return;
  if (e.touches.length > 1) { pullStartY = null; pullActive = false; return; }
  const dy = e.touches[0].clientY - pullStartY;
  if (dy <= 0 || !pullEligible(e.target)) { pullStartY = null; return; }
  pullActive = true;
  e.preventDefault(); // évite le rebond natif du navigateur pendant le tirage
  const dist = Math.min(dy * 0.5, PULL_MAX); // résistance : suit le doigt à moitié vitesse
  pullIndicatorWrap.style.transition = "none";
  pullIndicatorWrap.style.transform = `translate(-50%, ${dist - 34}px)`;
  pullIndicatorEl.classList.toggle("ready", dist >= PULL_TRIGGER);
}, { passive: false });

document.addEventListener("touchend", () => {
  pullIndicatorWrap.style.transition = "";
  if (!pullActive) { pullStartY = null; return; }
  const wasReady = pullIndicatorEl.classList.contains("ready");
  pullActive = false;
  pullStartY = null;
  if (!wasReady) {
    pullIndicatorWrap.style.transform = "";
    return;
  }
  pullRefreshing = true;
  pullIndicatorWrap.style.transform = `translate(-50%, ${PULL_TRIGGER - 34}px)`;
  pullIndicatorEl.classList.add("spinning");
  refreshCurrentPage().finally(() => {
    pullRefreshing = false;
    pullIndicatorEl.classList.remove("spinning", "ready");
    pullIndicatorWrap.style.transform = "";
  });
});

applyStaticTranslations();
setTheme(currentTheme); // synchronise les boutons actifs + la couleur de barre d'adresse avec le thème déjà posé par le script anti-flash
loadAlerts();
router();

// Pas de service worker : ce dashboard n'a pas d'utilité hors-ligne, et un
// cache periodiquement perime a cause plus de soucis (pages figees apres une
// mise a jour) qu'il n'apporte de benefice. On se contente de nettoyer une
// eventuelle installation precedente (versions anterieures de cette app).
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => {
    regs.forEach((r) => r.unregister());
  });
}
if (window.caches) {
  caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
}
</script>
