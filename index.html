<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervision RG System</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RG Dashboard">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b1220;
    --card: #131c2e;
    --card-border: #232f45;
    --text: #e7ecf5;
    --text-dim: #8ea0bd;
    --crit-critical: #ef4444;
    --crit-medium: #eab308;
    --crit-low: #64748b;
    --accent: #3b82f6;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 40px;
  }
  [hidden] { display: none !important; }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    /* iOS (PWA installée, barre de statut "black-translucent") dessine le
       contenu sous l'encoche/l'heure : on ajoute la zone sûre en plus du
       padding habituel pour ne pas passer dessous. env(...) vaut 0 ailleurs. */
    padding: calc(16px + env(safe-area-inset-top)) 16px 8px;
    border-bottom: 1px solid var(--card-border);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 1.1rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .app-version { font-size: 0.65rem; font-weight: 400; color: var(--text-dim); }

  .status-line {
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px 0;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.78rem;
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 12px 16px;
  }
  .summary .tile {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    font-family: inherit;
    cursor: pointer;
  }
  .summary .tile .n { font-size: 1.4rem; font-weight: 700; display: block; }
  .summary .tile .l { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .summary .tile.critical .n { color: var(--crit-critical); }
  .summary .tile.medium .n { color: var(--crit-medium); }
  .summary .tile.low .n { color: var(--crit-low); }
  .summary .tile.active { border-color: var(--accent); background: rgba(59,130,246,0.15); }

  .search-bar { margin-bottom: 10px; }
  .search-bar input[type="search"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    /* iOS Safari zoome automatiquement la page au focus si le champ fait
       moins de 16px : on reste a 16px pour l'empecher, sans desactiver
       le zoom utilisateur (mauvais pour l'accessibilite). */
    font-size: 16px;
  }
  .search-bar input[type="search"]::placeholder { color: var(--text-dim); }

  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .incident {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--crit-medium);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .incident { cursor: pointer; }
  .incident.critical { border-left-color: var(--crit-critical); }
  .incident.medium { border-left-color: var(--crit-medium); }
  .incident.low { border-left-color: var(--crit-low); }
  .incident.success { border-left-color: var(--ok); }
  .incident.acquitted { opacity: 0.45; }

  .incident .title { font-size: 0.92rem; font-weight: 600; margin-bottom: 4px; }
  .incident .meta { font-size: 0.75rem; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .incident .path { font-size: 0.75rem; color: var(--text-dim); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--card-border); }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.critical { background: rgba(239,68,68,0.15); color: var(--crit-critical); }
  .badge.medium { background: rgba(234,179,8,0.15); color: var(--crit-medium); }
  .badge.low { background: rgba(100,116,139,0.15); color: var(--crit-low); }
  .badge.success { background: rgba(34,197,94,0.15); color: var(--ok); }
  .badge.offline { background: rgba(148,163,184,0.15); color: var(--text-dim); }

  .mini-filter { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
  .mini-filter-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
  }
  .mini-filter-btn.active { color: var(--text); border-color: var(--accent); background: rgba(59,130,246,0.15); }

  .empty, .error, .loading {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 0.9rem;
  }
  .error { color: var(--crit-critical); }

  /* --- Parc (navigation nodes/agents) --- */
  .parc-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
  }
  .back-btn {
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.85rem;
  }
  .parc-title { font-weight: 600; font-size: 0.95rem; flex: 1; }

  .hamburger-btn {
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.95rem;
    position: relative;
  }
  .hamburger-btn.active::after {
    content: "";
    position: absolute;
    top: -2px;
    right: -2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid var(--bg);
  }

  .client-stats { display: flex; gap: 8px; padding: 0 16px 10px; }
  .client-stats .stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 6px 4px;
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
  .client-stats .stat .n { display: block; font-size: 1rem; font-weight: 700; color: var(--text); }

  .filter-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 16px 10px;
    background: rgba(59,130,246,0.15);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.78rem;
    width: fit-content;
  }
  .filter-chip button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 0.8rem;
    padding: 0;
    line-height: 1;
  }

  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 20;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 250px;
    max-width: 80vw;
    background: var(--card);
    border-right: 1px solid var(--card-border);
    z-index: 21;
    display: flex;
    flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 0 16px;
    overflow-y: auto;
  }
  .drawer-header {
    padding: 0 16px 12px;
    font-weight: 600;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--card-border);
    margin-bottom: 8px;
  }
  /* Sépare visuellement le groupe "Filtrer ce dossier" du groupe de
     navigation au-dessus : la ligne de séparation vient d'abord, le titre
     de la section se place juste en dessous. */
  #drawerFilterSection {
    border-top: 1px solid var(--card-border);
    margin-top: 8px;
    padding-top: 8px;
  }
  #drawerFilterSection .drawer-header { border-bottom: none; }
  .drawer-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    padding: 12px 16px;
    font-size: 0.88rem;
  }
  .drawer-item.active { background: rgba(59,130,246,0.15); color: var(--accent); font-weight: 600; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .row.offline { opacity: 0.55; }
  .row-icon { font-size: 1.15rem; }
  .row-name { flex: 1; font-size: 0.88rem; }
  .chev { color: var(--text-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.alert { background: var(--crit-critical); }
  .dot.online { background: var(--ok); }
  .dot.offline-dot { background: var(--text-dim); }

  .agent-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px;
    margin: 0 16px 14px;
  }
  .agent-card h2 { margin: 0 0 4px; font-size: 1.02rem; }
  .agent-sub { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 0.82rem; }
  .kv dt { color: var(--text-dim); margin: 0; }
  .kv dd { margin: 0; }

  .chart-cat {
    margin: 16px 16px 6px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }
  .chart-item { margin: 0 16px 8px; }
  .chart-toggle {
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .chart-panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 10px 12px;
    margin-top: -1px;
  }
  .scale-selector { display: flex; gap: 6px; margin-bottom: 8px; }
  .scale-selector button {
    flex: 1;
    padding: 5px;
    font-size: 0.72rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
  }
  .scale-selector button.active {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(59,130,246,0.15);
  }
  .chart-meta { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
  .chart-legend { display: flex; gap: 12px; font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; }
  .legend-item i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

  .map-container { height: 65vh; width: 100%; }

  .note-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .note-item .version { font-weight: 700; margin-bottom: 4px; }
  .note-item .text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<header>
  <div class="header-top">
    <button class="hamburger-btn" id="mainMenuBtn">☰</button>
    <h1 id="homeLink">🛰️ RG System Suite <span class="app-version">v0.42</span></h1>
  </div>
  <div class="search-bar" id="searchBarWrap">
    <input type="search" id="searchInput" placeholder="Rechercher un agent..." autocomplete="off">
  </div>
</header>

<!-- ===== Page Alertes ===== -->
<div id="page-alerts" hidden>
  <div class="status-line">
    <span id="statusText">Chargement…</span>
    <button class="refresh-btn" id="refreshBtn">↻ Actualiser</button>
  </div>

  <div class="summary" id="summary">
    <button type="button" class="tile critical" data-crit="critical"><span class="n" id="countCritical">–</span><span class="l">Critique</span></button>
    <button type="button" class="tile medium" data-crit="medium"><span class="n" id="countMedium">–</span><span class="l">Moyenne</span></button>
    <button type="button" class="tile low" data-crit="low"><span class="n" id="countLow">–</span><span class="l">Basse</span></button>
  </div>

  <div class="list" id="list">
    <div class="loading">Chargement des données…</div>
  </div>
</div>

<!-- ===== Page Parc (navigation + fiche agent) ===== -->
<div id="page-parc">

  <div id="parcSearchView" hidden>
    <div class="parc-header">
      <span class="parc-title">Résultats de recherche</span>
    </div>
    <div class="list" id="parcSearchList"></div>
  </div>

  <div id="parcTreeView">
    <div class="parc-header">
      <button class="back-btn" id="parcBackBtn" hidden>‹ Retour</button>
      <span class="parc-title" id="parcTitle">Parc</span>
      <button type="button" class="refresh-btn" id="parcRefreshBtn">↻ Actualiser</button>
    </div>
    <div class="client-stats" id="parcClientStats" hidden></div>
    <div class="filter-chip" id="parcFilterChip" hidden>
      <span class="label"></span>
      <button type="button" id="parcFilterClear">✕</button>
    </div>
    <div class="list" id="parcList">
      <div class="loading">Chargement…</div>
    </div>
  </div>

  <div id="parcAgentView" hidden>
    <div class="parc-header">
      <button class="back-btn" id="agentBackBtn">‹ Retour</button>
      <span class="parc-title" id="agentTitle">Agent</span>
      <button type="button" class="refresh-btn" id="agentRefreshBtn">↻ Actualiser</button>
    </div>
    <div id="agentBody">
      <div class="loading">Chargement…</div>
    </div>
  </div>

</div>

<!-- ===== Page Carte (clients géolocalisés) ===== -->
<div id="page-map" hidden>
  <div class="parc-header">
    <span class="parc-title">Carte des clients</span>
    <button type="button" class="refresh-btn" id="mapRefreshBtn">↻ Actualiser</button>
  </div>
  <div id="mapStatus" class="loading">Chargement…</div>
  <div id="mapContainer" class="map-container" style="display:none;"></div>
</div>

<!-- ===== Page Nouveautés (notes de version) ===== -->
<div id="page-whatsnew" hidden>
  <div class="parc-header">
    <span class="parc-title">Nouveautés</span>
  </div>
  <div class="list" id="whatsNewList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="drawer-overlay" id="drawerOverlay" hidden></div>
<div class="drawer" id="mainDrawer" hidden>
  <div class="drawer-header">Navigation</div>
  <button type="button" class="drawer-item" data-nav="parc">🗂️ Parc</button>
  <button type="button" class="drawer-item" data-nav="alerts">🔔 Alertes</button>
  <button type="button" class="drawer-item" data-nav="map">🗺️ Carte</button>
  <button type="button" class="drawer-item" data-nav="whatsnew">🆕 Nouveautés</button>

  <div id="drawerFilterSection" hidden>
    <div class="drawer-header">Filtrer ce dossier</div>
    <button type="button" class="drawer-item" data-filter="all">📋 Tous les agents</button>
    <button type="button" class="drawer-item" data-filter="S">🖥️ Serveurs uniquement</button>
    <button type="button" class="drawer-item" data-filter="W">💻 Postes uniquement</button>
    <button type="button" class="drawer-item" data-filter="alerts">🔔 Avec alertes uniquement</button>
  </div>
</div>

<script>
// ⚠️ Remplacez cette URL par celle de VOTRE Cloudflare Worker une fois déployé.
const WORKER_URL = "https://rg-dashboard-relay.s-seguier.workers.dev";
// Identifiant du node racine de votre compte (vu dans /api/me -> nodeId).
const ROOT_NODE_ID = "97531";

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function fetchJson(path) {
  const res = await fetch(WORKER_URL + path, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const payload = await res.json();
  if (payload?.result?.code && payload.result.code !== 200) {
    throw new Error(payload.result.message || "Erreur API");
  }
  return payload.data || {};
}

/* =========================================================
   Page Alertes
   ========================================================= */

const CRITICALITY_ORDER = { critical: 0, medium: 1, low: 2 };
const CRITICALITY_LABEL = { critical: "Critique", medium: "Moyenne", low: "Basse" };

const listEl = document.getElementById("list");
const statusText = document.getElementById("statusText");
const summaryEl = document.getElementById("summary");
const searchInputEl = document.getElementById("searchInput");
let lastIncidents = [];
let activeCriticality = null;
let currentPage = "parc";
let searchQuery = "";

function extractIncidents(data) {
  const incidents = [];
  const sections = [
    { key: "servers", groupKey: "plugins" },
    { key: "workstations", groupKey: "plugins" },
    { key: "devices", groupKey: "protocols" },
  ];

  for (const { key, groupKey } of sections) {
    for (const entry of data[key] || []) {
      const agent = entry.agent || {};
      if (HIDDEN_AGENT_TYPES.has(agent.type)) continue;
      const groups = entry[groupKey] || {};
      for (const [category, items] of Object.entries(groups)) {
        for (const item of items || []) {
          incidents.push({
            ...item,
            category,
            agentName: agent.name || agent.id || "Agent inconnu",
            agentId: agent.id,
            nodePath: Array.isArray(agent.nodePath) ? agent.nodePath.join(" / ") : "",
            isOnline: agent.isOnline,
          });
        }
      }
    }
  }

  incidents.sort((a, b) => {
    const ca = CRITICALITY_ORDER[a.criticality] ?? 9;
    const cb = CRITICALITY_ORDER[b.criticality] ?? 9;
    if (ca !== cb) return ca - cb;
    if (a.acquitted !== b.acquitted) return a.acquitted ? 1 : -1;
    return 0;
  });

  return incidents;
}

function renderSummary(incidents) {
  const counts = { critical: 0, medium: 0, low: 0 };
  for (const inc of incidents) {
    if (inc.acquitted) continue;
    if (counts[inc.criticality] !== undefined) counts[inc.criticality]++;
  }
  document.getElementById("countCritical").textContent = counts.critical;
  document.getElementById("countMedium").textContent = counts.medium;
  document.getElementById("countLow").textContent = counts.low;
}

function renderAlertList() {
  const q = searchQuery.toLowerCase();
  const items = lastIncidents.filter((inc) => {
    if (inc.acquitted) return false;
    if (activeCriticality && inc.criticality !== activeCriticality) return false;
    if (q) {
      const haystack = [inc.title, inc.agentName, inc.nodePath].filter(Boolean).join(" ").toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  summaryEl.querySelectorAll(".tile").forEach((tile) => {
    tile.classList.toggle("active", tile.dataset.crit === activeCriticality);
  });

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty">✅ Aucune alerte à afficher</div>';
    return;
  }

  listEl.innerHTML = items.map((inc) => {
    const crit = CRITICALITY_ORDER[inc.criticality] !== undefined ? inc.criticality : "low";
    const label = CRITICALITY_LABEL[crit] || inc.criticality || "?";
    return `
      <div class="incident ${crit} ${inc.acquitted ? "acquitted" : ""}" data-agent-id="${escapeHtml(inc.agentId || "")}">
        <div class="title">${escapeHtml(inc.title || "Incident sans titre")}</div>
        <div class="meta">
          <span class="badge ${crit}">${label}</span>
          ${inc.isOnline === false ? '<span class="badge offline">Hors ligne</span>' : ""}
          <span>${escapeHtml(inc.agentName)}</span>
          ${inc.acquitted ? "<span>· acquittée</span>" : ""}
        </div>
        <div class="path">📍 ${escapeHtml(inc.nodePath || "Emplacement inconnu")}</div>
      </div>
    `;
  }).join("");
}

listEl.addEventListener("click", (e) => {
  const incident = e.target.closest(".incident");
  const agentId = incident?.dataset.agentId;
  if (agentId) location.hash = "#/parc/agent/" + encodeURIComponent(agentId);
});

summaryEl.addEventListener("click", (e) => {
  const tile = e.target.closest(".tile");
  if (!tile) return;
  activeCriticality = activeCriticality === tile.dataset.crit ? null : tile.dataset.crit;
  renderAlertList();
});

/* --- Recherche : suit l'onglet actif (Alertes ou Parc) --- */

function agentSearchRowHtml(a) {
  const icon = AGENT_TYPE_ICON[a.agentType] || AGENT_TYPE_ICON[a.agentTrueType] || "🔹";
  const path = Array.isArray(a.agentPath) ? a.agentPath.join(" / ") : "";
  return `
    <div class="row agent ${a.isConnected === 0 ? "offline" : ""}" data-agent="${escapeHtml(a.agentId)}">
      <span class="row-icon">${icon}</span>
      <div style="flex:1; min-width:0;">
        <div class="row-name">${escapeHtml(a.agentName)}</div>
        <div class="path">📍 ${escapeHtml(path || "Emplacement inconnu")}</div>
      </div>
      <span class="dot ${a.isConnected === 2 ? "online" : "offline-dot"}"></span>
    </div>`;
}

// On charge une seule fois tout le pedigree du compte (un seul appel, via
// maxResults élevé) puis on filtre en mémoire sur de vrais sous-chaînes,
// dans un large jeu de champs. Ça évite d'interroger l'API à chaque frappe
// (risque de dépasser la limite de requêtes) et garantit une correspondance
// fiable sur le nom complet plutôt que de dépendre du filtre serveur.
let allAgentsCache = null;
let allAgentsPromise = null;

async function loadAllAgents() {
  if (allAgentsCache) return allAgentsCache;
  if (!allAgentsPromise) {
    allAgentsPromise = fetchJson(`/api/node/${ROOT_NODE_ID}/pedigree?maxResults=1000`)
      .then((data) => { allAgentsCache = data.agents || []; return allAgentsCache; })
      .catch((err) => { allAgentsPromise = null; throw err; });
  }
  return allAgentsPromise;
}

function agentHaystack(a) {
  const fields = [
    a.agentName, a.csName, a.dnsHostname, a.privateIp, a.publicIp, a.configuredIp,
    a.osName, a.osVersion, a.comment, a.manufacturer, a.model, a.serialNumber,
    a.hardwareSerialNumber, a.installedBy, a.lastLoggedOnUser, a.domain, a.nodeName,
    a.cpuInfos, a.memoryInfos, a.diskInfos, a.networkInfos, a.agentVersion,
    Array.isArray(a.agentPath) ? a.agentPath.join(" ") : "",
    Array.isArray(a.tags) ? a.tags.join(" ") : "",
  ];
  return fields.filter(Boolean).join("  ").toLowerCase();
}

let parcSearchRequestId = 0;

async function renderParcSearch() {
  const q = searchQuery.trim().toLowerCase();
  if (q.length < 2) {
    parcSearchList.innerHTML = '<div class="empty">Tapez au moins 2 caractères pour rechercher</div>';
    return;
  }

  const requestId = ++parcSearchRequestId;
  parcSearchList.innerHTML = '<div class="loading">Recherche…</div>';
  try {
    const agents = await loadAllAgents();
    if (requestId !== parcSearchRequestId) return; // une frappe plus récente a pris le dessus
    const matches = agents
      .filter((a) => !HIDDEN_AGENT_TYPES.has(a.agentType) && agentHaystack(a).includes(q))
      .slice(0, 30);
    parcSearchList.innerHTML = matches.length
      ? matches.map(agentSearchRowHtml).join("")
      : '<div class="empty">Aucun agent trouvé</div>';
  } catch (err) {
    if (requestId !== parcSearchRequestId) return;
    parcSearchList.innerHTML = '<div class="error">Erreur de recherche : ' + escapeHtml(err.message) + '</div>';
  }
}

let parcTypeFilter = "all"; // all | S | W | alerts

  S: "Serveurs uniquement",
  W: "Postes uniquement",
  alerts: "Avec alertes uniquement",
};

function folderVisible(c) {
  return parcTypeFilter === "alerts" ? !!c.hasAlerts : true;
}
function agentVisible(c) {
  if (parcTypeFilter === "all") return true;
  if (parcTypeFilter === "alerts") return !!c.hasAlerts;
  return c.type === parcTypeFilter;
}

// Certains agents ont un type "corrigé" (agentTrueType) différent du type
// brut (agentType) — ex. un agent déclaré "S" (serveur) qui est en réalité
// un poste "W". Le type effectif privilégie toujours la correction.
function agentEffectiveType(a) {
  return a.agentTrueType || a.agentType;
}

let clientStatsRequestId = 0; // ignore une réponse async devenue obsolète si on change vite de dossier

async function updateClientStats(nodeId) {
  const requestId = ++clientStatsRequestId;
  try {
    const agents = await loadAllAgents();
    if (requestId !== clientStatsRequestId) return; // l'utilisateur a déjà changé de dossier
    const nodeIdStr = String(nodeId);
    const underNode = agents.filter((a) => Array.isArray(a.path) && a.path.some((p) => String(p) === nodeIdStr));
    let servers = 0, workstations = 0, devices = 0;
    for (const a of underNode) {
      const t = agentEffectiveType(a);
      if (t === "S") servers++;
      else if (t === "W") workstations++;
      else if (t === "D" || t === "E") devices++;
    }
    parcClientStats.innerHTML = `
      <div class="stat"><span class="n">${servers}</span>🖥️ Serveur(s)</div>
      <div class="stat"><span class="n">${workstations}</span>💻 Poste(s)</div>
      <div class="stat"><span class="n">${devices}</span>📡 Device(s)</div>
    `;
    parcClientStats.hidden = false;
  } catch (err) {
    console.error(err);
  }
}

async function loadNode(nodeId) {
  currentTreeNodeId = nodeId;
  parcTitleEl.textContent = "Parc";
  parcBackBtn.hidden = String(nodeId) === String(ROOT_NODE_ID);
  parcListEl.innerHTML = '<div class="loading">Chargement…</div>';
  parcClientStats.hidden = true;
  clientStatsRequestId++; // annule toute stat en cours de calcul pour l'ancien dossier
  try {
    const data = await fetchJson(`/api/node/${encodeURIComponent(nodeId)}/children`);
    const node = data[nodeId] || Object.values(data)[0];
    if (!node) throw new Error("Node introuvable");
    lastLoadedNode = node;
    renderNodeList();
    // Les compteurs sont utiles sur n'importe quel dossier, pas seulement les
    // nodes clients (ex. un groupe de VMs qui n'est pas un client à proprement parler).
    updateClientStats(nodeId);
  } catch (err) {
    parcListEl.innerHTML = '<div class="error">Erreur de chargement : ' + escapeHtml(err.message) + '</div>';
    console.error(err);
  }
}

function renderNodeList() {
  const node = lastLoadedNode;
  if (!node) return;
  parcTitleEl.textContent = node.name || "Parc";

  if (parcTypeFilter === "all") {
    parcFilterChip.hidden = true;
  } else {
    parcFilterChip.hidden = false;
    parcFilterChip.querySelector(".label").textContent = "Filtre : " + FILTER_LABEL[parcTypeFilter];
  }
  mainMenuBtn.classList.toggle("active", parcTypeFilter !== "all");

  const children = Object.entries(node.children || {});
  const folders = children
    .filter(([, c]) => c.nodeType === "node" && folderVisible(c))
    .sort((a, b) => a[1].name.localeCompare(b[1].name));
  const agents = children
    .filter(([, c]) => c.nodeType === "agent" && !HIDDEN_AGENT_TYPES.has(c.type) && agentVisible(c))
    .sort((a, b) => a[1].name.localeCompare(b[1].name));

  if (folders.length === 0 && agents.length === 0) {
    parcListEl.innerHTML = '<div class="empty">Aucun résultat pour ce filtre</div>';
    return;
  }

  parcListEl.innerHTML =
    folders.map(([id, c]) => nodeRowHtml(id, c)).join("") +
    agents.map(([id, c]) => agentRowHtml(id, c)).join("");
}

const SCALE_LABEL = { day: "24 h", week: "7 jours", month: "30 jours", year: "12 mois" };

function formatDate(iso) {
  if (!iso) return "–";
  try { return new Date(iso).toLocaleString("fr-FR"); } catch { return iso; }
}

function uptimeSummary(uptime) {
  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) + " %" : "–");
  return `${fmt(uptime.day)} (24h) · ${fmt(uptime.week)} (7j) · ${fmt(uptime.month)} (30j)`;
}

function windowsUpdateSummary(p) {
  if (!p.WindowsUpdateStatus) return "–";
  const details = [];
  if (p.WindowsUpdateCriticalCount) details.push(p.WindowsUpdateCriticalCount + " critique(s)");
  if (p.WindowsUpdateOptionalCount) details.push(p.WindowsUpdateOptionalCount + " optionnelle(s)");
  if (p.WindowsUpdateIsRebootNeeded) details.push("redémarrage requis");
  return p.WindowsUpdateStatus + (details.length ? " (" + details.join(", ") + ")" : "");
}

function serialSummary(p) {
  // Le SerialNumber Windows est souvent masqué par RG System (XXXXX-...) ;
  // le HardwareSerialNumber (UUID matériel) est lui exploitable.
  if (p.HardwareSerialNumber) return p.HardwareSerialNumber;
  if (p.SerialNumber && !/^X+-/i.test(p.SerialNumber)) return p.SerialNumber;
  return "–";
}

function domainSummary(p) {
  if (p.PartOfDomain === "1" && p.Domain) return p.Domain;
  if (p.PartOfDomain === "0") return "Hors domaine";
  return p.Domain || "–";
}

// "Onair" (Communication) est fusionné dans le groupe "Heartbeat" : ce sont
// deux indicateurs de présence de l'agent, plus lisibles regroupés.
const CHART_GROUP_OVERRIDE = { Onair: "Heartbeat" };

// Ordre d'affichage demandé (retour utilisateur) : présence de l'agent
// d'abord, puis capacité (disque, disque E/S, mémoire, CPU), puis sécurité et
// réseau. Tout groupe non listé (peu probable en pratique) est ajouté à la
// fin par ordre alphabétique plutôt que d'être perdu silencieusement.
const CHART_GROUP_ORDER = ["Heartbeat", "Disques", "Disques E/S", "Mémoire", "Processeurs", "Antivirus", "Trafic réseau"];

// "Octets Transmis par l'Agent" (bruit technique bas niveau, sans intérêt pour
// un diagnostic rapide) est volontairement exclu de l'affichage.
const EXCLUDED_CHART_COUNTERS = new Set(["SentBytes"]);

function collectChartables(objects) {
  const groups = new Map(); // nom de groupe affiché -> { name, items }
  for (const [key, cat] of Object.entries(objects || {})) {
    const items = [];
    for (const [objId, obj] of Object.entries(cat.objects || {})) {
      if (!obj.charts) continue;
      for (const [chartId, chart] of Object.entries(obj.charts)) {
        const countersStr = Array.isArray(chart.counters) ? chart.counters.join(" ") : (chart.counters || "");
        if (countersStr.split(" ").some((c) => EXCLUDED_CHART_COUNTERS.has(c))) continue;
        items.push({
          objId,
          chartId,
          chartName: chart.name,
          counters: chart.counters,
          objName: obj.name,
          isMono: cat.isMonoObject,
        });
      }
    }
    if (!items.length) continue;

    const groupName = CHART_GROUP_OVERRIDE[key] || cat.name;
    if (!groups.has(groupName)) groups.set(groupName, { name: groupName, items: [] });
    groups.get(groupName).items.push(...items);
  }
  const categories = [...groups.values()];
  categories.sort((a, b) => {
    const ia = CHART_GROUP_ORDER.indexOf(a.name);
    const ib = CHART_GROUP_ORDER.indexOf(b.name);
    if (ia === -1 && ib === -1) return a.name.localeCompare(b.name);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  return categories;
}

function chartItemHtml(item, groupName) {
  const base = item.isMono ? item.chartName : `${item.chartName} — ${item.objName}`;
  // Certains noms de courbe ("Actif") existent dans plusieurs groupes
  // (Heartbeat, Antivirus...) : on préfixe par le groupe pour lever
  // l'ambiguïté, sauf quand le nom du groupe est déjà redondant avec le libellé.
  const label = groupName && !base.toLowerCase().includes(groupName.toLowerCase())
    ? `${groupName} — ${base}`
    : base;
  const uid = item.objId + "_" + item.chartId;
  // Selon les agents, l'API renvoie "counters" soit en chaîne ("A B"), soit en tableau (["A","B"]).
  // On normalise ici en chaîne espacée pour que l'attribut data- et interpretChartData restent simples.
  const countersStr = Array.isArray(item.counters) ? item.counters.join(" ") : item.counters;
  return `
    <div class="chart-item">
      <button class="chart-toggle" data-uid="${uid}" data-obj="${item.objId}" data-chart="${item.chartId}" data-counters="${escapeHtml(countersStr)}">
        📈 ${escapeHtml(label)}
      </button>
      <div class="chart-panel" id="panel-${uid}" hidden></div>
    </div>`;
}

// Petite barre de filtres pill-shaped, réutilisée pour les alertes et les
// événements de la fiche agent (options = [[valeur, libellé], ...], valeur
// vide = "Toutes").
function miniFilterBarHtml(options, active, dataAttr) {
  const buttons = options.map(([val, label]) => {
    const isActive = (active || "") === val;
    return `<button type="button" class="mini-filter-btn ${isActive ? "active" : ""}" data-${dataAttr}="${escapeHtml(val)}">${escapeHtml(label)}</button>`;
  }).join("");
  return `<div class="mini-filter">${buttons}</div>`;
}

function incidentCriticality(inc) {
  return CRITICALITY_ORDER[inc.criticality] !== undefined ? inc.criticality : "low";
}

let agentAlertFilter = null; // null (Toutes) | "critical" | "medium" | "low"

function renderAgentIncidents(agentId) {
  const all = lastIncidents.filter((inc) => inc.agentId === agentId && !inc.acquitted);
  const items = agentAlertFilter ? all.filter((inc) => incidentCriticality(inc) === agentAlertFilter) : all;
  const filterBar = all.length
    ? miniFilterBarHtml([["", "Toutes"], ["critical", "Critique"], ["medium", "Moyenne"], ["low", "Basse"]], agentAlertFilter, "agent-alert-filter")
    : "";
  const body = items.length
    ? items.map((inc) => {
        const crit = incidentCriticality(inc);
        const label = CRITICALITY_LABEL[crit] || inc.criticality || "?";
        return `
          <div class="incident ${crit}" style="cursor:default;">
            <div class="title">${escapeHtml(inc.title || "Incident sans titre")}</div>
            <div class="meta"><span class="badge ${crit}">${label}</span></div>
          </div>`;
      }).join("")
    : `<div class="empty">${all.length ? "Aucune alerte pour ce filtre" : "✅ Aucune alerte pour cet agent"}</div>`;
  return `<div id="agentAlertsSection"><div class="chart-cat">Alertes</div>${filterBar}<div class="list">${body}</div></div>`;
}

// Historique unifié des jobs de sauvegarde (Files & Data pour S/W, Microsoft
// 365 pour O) via /api/target/{agent}/backup/activity. Un seul endpoint pour
// les deux familles de produits, avec un vrai statut de job (pas juste
// "installé ou pas").
const BACKUP_STATUS_LABEL = {
  success: "Succès",
  error: "Erreur",
  warning: "Avertissement",
  running: "En cours",
  waiting_first_backup: "Première sauvegarde en attente",
  unknown: "Inconnu",
};

function backupActivityClass(status) {
  if (status === "success") return "success";
  if (status === "error") return "critical";
  if (status === "warning") return "medium";
  return "low"; // running, waiting_first_backup, unknown
}

const PLUGIN_LABEL = {
  file: "Fichiers", mssql: "SQL Server", oracle: "Oracle", hyperV: "Hyper-V",
  bareMetal: "Bare Metal", vCenter: "vCenter", replication: "Réplication", exchange: "Exchange",
};

function backupActivityMeta(a) {
  const parts = [];
  if (Number.isFinite(a.duration)) parts.push(Math.round(a.duration / 60) + " min");
  if (Number.isFinite(a.size) && a.size > 0) parts.push(formatBytes(a.size));
  return parts.join(" · ");
}

function backupActivityDetail(a) {
  const parts = [];
  if (a.backupError) parts.push(String(a.backupError).trim());

  let specific = null;
  try { specific = JSON.parse(a.specificData || "null"); } catch (e) { /* pas de JSON exploitable */ }
  if (specific && Array.isArray(specific.logs) && specific.logs.length) {
    parts.push(specific.logs.map((l) => (typeof l === "string" ? l : JSON.stringify(l))).join("\n"));
  }

  const succ = a.objectSuccess, fail = a.objectFailure;
  if ((Number.isFinite(succ) && succ > 0) || (Number.isFinite(fail) && fail > 0)) {
    parts.push(`Objets : ${succ ?? 0} réussi(s), ${fail ?? 0} échoué(s)`);
  }

  return parts.join("\n\n").trim();
}

function backupActivityRowHtml(a, index) {

async function renderBackupActivitySection(agentId) {
  try {
    const qs = new URLSearchParams({ sortField: "date", sortWay: "DESC" }).toString();
    const data = await fetchJson(`/api/target/${encodeURIComponent(agentId)}/backup/activity?${qs}`);
    const activities = data.data || [];

    // Le domaine M365 (organization) est porté par chaque activité : on le
    // récupère au passage pour l'afficher dans l'en-tête de la fiche agent.
    const orgName = activities.find((a) => a.organization?.name)?.organization?.name || null;

    // Un job par produit ET par volet, par exécution : on garde le plus récent
    // de chaque combinaison (un même plugin, ex. "file", peut exister sous
    // deux produits différents en parallèle, ex. Files & Data 1.0 et 2.0).
    const latestByKey = new Map();
    for (const a of activities) {
      const key = (a.product || "") + "|" + (a.plugin || "");
      if (!latestByKey.has(key)) latestByKey.set(key, a);
    }

    if (latestByKey.size === 0) return { html: "", orgName }; // aucune sauvegarde détectée : section masquée

    const rows = [...latestByKey.values()].map(backupActivityRowHtml).join("");
    return { html: `<div class="chart-cat">Sauvegarde</div><div class="list">${rows}</div>`, orgName };
  } catch (err) {
    return { html: `<div class="chart-cat">Sauvegarde</div><div class="error">Erreur : ${escapeHtml(err.message)}</div>`, orgName: null };
  }
}

let currentAgentId = null;

async function loadAgent(agentId) {
  currentAgentId = agentId;
  agentAlertFilter = null;
  agentEventFilter = null;
  lastAgentEvents = [];
  agentTitleEl.textContent = "Agent";
  agentBodyEl.innerHTML = '<div class="loading">Chargement…</div>';
  try {
    const [ped, objects] = await Promise.all([
      fetchJson(`/api/agent/${encodeURIComponent(agentId)}`),
      fetchJson(`/api/agent/${encodeURIComponent(agentId)}/objects`).catch(() => ({})),
    ]);

    // Type "L" (lien/agent léger) n'a ni courbes de supervision exploitables,
    // ni journal d'événements Windows, ni alertes pertinentes : on masque ces
    // trois blocs plutôt que d'afficher des sections vides.
    const showSupervisionBlocks = ped.type !== "L";

    const categories = showSupervisionBlocks ? collectChartables(objects) : [];
    const chartsHtml = !showSupervisionBlocks ? "" : categories.length
      ? `<div class="chart-cat">Courbes</div>` +
        `<div class="mini-filter"><button type="button" class="mini-filter-btn" data-charts-toggle-all>Tout afficher</button></div>` +
        `<div id="agentChartsList">${categories.map((cat) => cat.items.map((item) => chartItemHtml(item, cat.name)).join("")).join("")}</div>`
      : '<div class="empty">Aucune courbe disponible pour cet agent</div>';

    const backupPromise = ["S", "W", "O"].includes(ped.type)
      ? renderBackupActivitySection(agentId)
      : Promise.resolve({ html: "", orgName: null });
    const eventsPromise = showSupervisionBlocks ? renderAgentEventsSection(agentId) : Promise.resolve("");
    const [backupResult, eventsHtml] = await Promise.all([backupPromise, eventsPromise]);
    const { html: backupHtml, orgName } = backupResult;

    const incidentsHtml = showSupervisionBlocks ? renderAgentIncidents(agentId) : "";
    agentBodyEl.innerHTML = renderAgentPedigree(agentId, ped, orgName) + backupHtml + chartsHtml + incidentsHtml + eventsHtml;
  } catch (err) {
    agentBodyEl.innerHTML = '<div class="error">Erreur de chargement : ' + escapeHtml(err.message) + '</div>';
    console.error(err);
  }
}

agentBodyEl.addEventListener("click", (e) => {
  const expandAllBtn = e.target.closest("[data-charts-toggle-all]");
  if (expandAllBtn) {
    const list = document.getElementById("agentChartsList");
    const toggles = list ? [...list.querySelectorAll(".chart-toggle")] : [];
    const anyCollapsed = toggles.some((t) => document.getElementById("panel-" + t.dataset.uid)?.hidden);
    toggles.forEach((t) => {
      const panel = document.getElementById("panel-" + t.dataset.uid);
      if (!panel) return;
      if (anyCollapsed) {
        if (panel.hidden) {
          panel.hidden = false;
          if (t.dataset.obj) loadChart(panel, t.dataset.obj, t.dataset.chart, t.dataset.counters, "week");
        }
      } else {
        panel.hidden = true;
      }
    });
    expandAllBtn.textContent = anyCollapsed ? "Tout replier" : "Tout afficher";
    return;
  }

  const alertFilterBtn = e.target.closest("[data-agent-alert-filter]");
  if (alertFilterBtn) {
    agentAlertFilter = alertFilterBtn.dataset.agentAlertFilter || null;
    const section = document.getElementById("agentAlertsSection");
    if (section) section.outerHTML = renderAgentIncidents(currentAgentId);
    return;
  }

  const eventFilterBtn = e.target.closest("[data-agent-event-filter]");
  if (eventFilterBtn) {
    agentEventFilter = eventFilterBtn.dataset.agentEventFilter || null;
    const section = document.getElementById("agentEventsSection");
    if (section) section.outerHTML = renderAgentEventsBlock();
    return;
  }

  const incident = e.target.closest(".incident[data-uid]");
  if (incident) {
    const panel = document.getElementById("panel-" + incident.dataset.uid);
    if (panel) panel.hidden = !panel.hidden;
    return;
  }

  const btn = e.target.closest(".chart-toggle");
  if (!btn) return;
  const panel = document.getElementById("panel-" + btn.dataset.uid);
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.hidden = false;
  // Le panneau "commentaire" n'a pas de graphique associé, juste du texte déjà en place.
  if (btn.dataset.obj) {
    loadChart(panel, btn.dataset.obj, btn.dataset.chart, btn.dataset.counters, "week");
  }
});

function scaleSelectorHtml(scale) {
  return `
    <div class="scale-selector">
      ${Object.keys(SCALE_LABEL).map((s) => `<button data-scale="${s}" class="${s === scale ? "active" : ""}">${SCALE_LABEL[s]}</button>`).join("")}
    </div>
    <div class="chart-host"><div class="loading">Chargement…</div></div>
  `;
}

// Ces compteurs ne prennent jamais que deux valeurs (0 ou 1) : un graphique
// en ligne classique n'est pas lisible pour ça, on affiche une barre d'état.
const BOOLEAN_COUNTERS = new Set(["Alive", "AvActive", "AvUpToDate"]);

async function loadChart(panel, objId, chartId, counters, scale) {
  panel.innerHTML = scaleSelectorHtml(scale);
  panel.querySelectorAll(".scale-selector button").forEach((b) => {
    b.addEventListener("click", () => loadChart(panel, objId, chartId, counters, b.dataset.scale));
  });

  const host = panel.querySelector(".chart-host");
  try {
    const data = await fetchJson(`/api/chart/data/${objId}/${chartId}/${scale}`);
    if (BOOLEAN_COUNTERS.has(counters)) {
      host.innerHTML = buildStatusBarSvg(data[counters] || [], scale);
    } else {
      const interpreted = interpretChartData(counters, data);
      host.innerHTML = buildLineChartSvg(interpreted, scale);
    }
  } catch (err) {
    host.innerHTML = '<div class="error">Erreur : ' + escapeHtml(err.message) + '</div>';
  }
}

function buildStatusBarSvg(values, scale) {
  if (!values.length) return '<div class="empty">Pas de données sur cette période</div>';

  const W = 300, H = 50, padL = 2, padR = 2, padT = 2, padB = 2;
  const n = values.length;
  const barW = (W - padL - padR) / n;
  const bars = values.map((v, i) => {
    const active = v >= 0.5;
    const x = padL + i * barW;
    return `<rect x="${x.toFixed(2)}" y="${padT}" width="${Math.max(barW - 0.3, 0.5).toFixed(2)}" height="${H - padT - padB}" fill="${active ? "#5aa06a" : "#c9615f"}" />`;
  }).join("");
  const activeCount = values.filter((v) => v >= 0.5).length;
  const pct = ((activeCount / n) * 100).toFixed(1);

  return `
    <div class="chart-meta">Actif <strong>${pct}%</strong> du temps · période : ${SCALE_LABEL[scale] || scale}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${bars}</svg>
  `;
}

function interpretChartData(counters, data) {
  const keys = counters.split(" ").filter(Boolean);

  if (keys.length === 2) {
    const totalKey = keys.find((k) => /Size$/i.test(k));
    const usedKey = keys.find((k) => k !== totalKey);
    if (totalKey && usedKey && Array.isArray(data[totalKey]) && Array.isArray(data[usedKey])) {
      const values = data[usedKey].map((v, i) => {
        const total = data[totalKey][i];
        return total ? (v / total) * 100 : 0;
      });
      // Tendance affichée uniquement pour Disque/Mémoire (branche "utilisation
      // sur capacité"), pas pour les compteurs bruts (CPU, réseau...).
      return { unit: "%", series: [{ name: "Utilisation", values }], showTrend: true };
    }
  }

  const series = keys.filter((k) => Array.isArray(data[k])).map((k) => ({ name: k, values: data[k] }));
  if (series.length === 0) return { unit: "", series: [] };

  const flat = series.flatMap((s) => s.values).filter(Number.isFinite);
  const looksLikePercent = series.length === 1 && flat.length > 0 && Math.max(...flat) <= 100.0001;
  return { unit: looksLikePercent ? "%" : "", series };
}

function clampNum(v, min, max) {
  if (!Number.isFinite(v)) return min;
  return Math.min(max, Math.max(min, v));
}

function formatBytes(n) {
  if (!Number.isFinite(n)) return "–";
  if (Math.abs(n) < 1024) return n.toFixed(0);
  const units = ["Ko", "Mo", "Go", "To"];
  let v = n, i = -1;
  do { v /= 1024; i++; } while (Math.abs(v) >= 1024 && i < units.length - 1);
  return v.toFixed(1) + " " + units[i];
}

function formatValue(v, unit) {
  if (!Number.isFinite(v)) return "–";
  return unit === "%" ? v.toFixed(1) + " %" : formatBytes(v);
}

// Régression linéaire simple (moindres carrés) sur une série de valeurs
// régulièrement espacées, pour tracer une tendance générale.
function computeTrend(values) {
  const pts = values.map((v, i) => [i, v]).filter(([, v]) => Number.isFinite(v));
  if (pts.length < 2) return null;
  const n = pts.length;
  const sumX = pts.reduce((s, [x]) => s + x, 0);
  const sumY = pts.reduce((s, [, y]) => s + y, 0);
  const sumXY = pts.reduce((s, [x, y]) => s + x * y, 0);
  const sumXX = pts.reduce((s, [x]) => s + x * x, 0);
  const denom = n * sumXX - sumX * sumX;
  if (denom === 0) return null;
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  return { slope, intercept };
}

function buildLineChartSvg(interpreted, scale) {
  const { unit, series, showTrend } = interpreted;
  if (!series.length || series.every((s) => s.values.length === 0)) {
    return '<div class="empty">Pas de données sur cette période</div>';
  }

  const W = 300, H = 140, padL = 38, padR = 10, padT = 10, padB = 10;
  const flat = series.flatMap((s) => s.values).filter(Number.isFinite);
  let min = Math.min(...flat);
  let max = Math.max(...flat);

  if (unit === "%") { min = 0; max = 100; }
  else {
    if (min > 0) min = 0;
    max = max === min ? min + 1 : max + (max - min) * 0.1;
  }

  const colors = ["#3b82f6", "#22c55e", "#f97316"];

  const paths = series.map((s, idx) => {
    const n = s.values.length;
    const points = s.values.map((v, i) => {
      const x = padL + (n > 1 ? i / (n - 1) : 0) * (W - padL - padR);
      const y = padT + (1 - (clampNum(v, min, max) - min) / ((max - min) || 1)) * (H - padT - padB);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return `<polyline points="${points}" fill="none" stroke="${colors[idx % colors.length]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />`;
  }).join("");

  let trendLine = "";
  if (showTrend) {
    const trend = computeTrend(series[0].values);
    if (trend) {
      const n = series[0].values.length;
      const y0 = clampNum(trend.intercept, min, max);
      const y1 = clampNum(trend.slope * (n - 1) + trend.intercept, min, max);
      const yy0 = padT + (1 - (y0 - min) / ((max - min) || 1)) * (H - padT - padB);
      const yy1 = padT + (1 - (y1 - min) / ((max - min) || 1)) * (H - padT - padB);
      trendLine = `<line x1="${padL}" y1="${yy0.toFixed(1)}" x2="${W - padR}" y2="${yy1.toFixed(1)}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.55" />`;
    }
  }

  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + f * (H - padT - padB);
    const val = max - f * (max - min);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#232f45" stroke-width="1" />
      <text x="${(padL - 4).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8ea0bd">${formatValue(val, unit)}</text>`;
  }).join("");

  const legend = series.length > 1
    ? `<div class="chart-legend">${series.map((s, i) => `<span class="legend-item"><i style="background:${colors[i % colors.length]}"></i>${escapeHtml(s.name)}</span>`).join("")}</div>`
    : "";

  const latest = series[0].values[series[0].values.length - 1];

  return `
    <div class="chart-meta">Dernière valeur : <strong>${formatValue(latest, unit)}</strong> · période : ${SCALE_LABEL[scale] || scale}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${gridLines}${trendLine}${paths}</svg>
    ${legend}
  `;
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

// Géocodage gratuit via Nominatim (OpenStreetMap) : pas de clé API, mais
// limité à 1 requête/seconde et à utiliser avec parcimonie. Les résultats
// sont mis en cache dans le navigateur (une adresse d'entreprise change
// rarement) pour ne géocoder chaque client qu'une seule fois.
async function geocodeAddress(address) {
  const cacheKey = "rgdash-geocode:" + address;
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);
  } catch (e) { /* stockage indisponible : on re-géocode simplement */ }

  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(address);
  const res = await fetch(url);
  if (!res.ok) throw new Error("Géocodage indisponible (HTTP " + res.status + ")");
  const results = await res.json();
  if (!results.length) return null;
  const point = { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
  try { localStorage.setItem(cacheKey, JSON.stringify(point)); } catch (e) { /* pas bloquant */ }
  return point;
}

let mapInstance = null;
let mapLoaded = false; // évite de re-géocoder à chaque retour sur la page

async function loadMapPage() {
  const statusEl = document.getElementById("mapStatus");
  const containerEl = document.getElementById("mapContainer");

  if (mapLoaded) {
    statusEl.hidden = true;
    containerEl.style.display = "block";
    if (mapInstance) setTimeout(() => mapInstance.invalidateSize(), 0);
    return;
  }

  statusEl.hidden = false;
  statusEl.textContent = "Chargement des clients…";
  containerEl.style.display = "none";

  try {
    const agents = await loadAllAgents();
    const customers = new Map();
    for (const a of agents) {
      if (a.customer?.id && !customers.has(a.customer.id)) {
        customers.set(a.customer.id, { id: a.customer.id, name: a.customer.name });
      }
    }

    if (customers.size === 0) {
      statusEl.textContent = "Aucun client trouvé dans le parc.";
      return;
    }

    const pins = [];
    let i = 0;
    for (const customer of customers.values()) {
      i++;
      statusEl.textContent = `Localisation des clients… (${i}/${customers.size})`;
      try {
        const details = await fetchJson(`/api/node/${encodeURIComponent(customer.id)}/customer`);
        if (!details.companyAddress) continue;
        const point = await geocodeAddress(details.companyAddress);
        if (point) pins.push({ ...point, name: details.companyName || customer.name, address: details.companyAddress, nodeId: customer.id });
      } catch (err) {
        console.error("Client " + customer.id + " :", err);
      }
      await sleep(1000); // politique d'usage Nominatim : 1 requête/seconde max
    }

    if (pins.length === 0) {
      statusEl.textContent = "Aucun client n'a pu être localisé (adresse manquante ou introuvable).";
      return;
    }

    statusEl.hidden = true;
    containerEl.style.display = "block";

    mapInstance = L.map(containerEl);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(mapInstance);

    const markers = pins.map((pin) => {
      const marker = L.marker([pin.lat, pin.lng]).addTo(mapInstance);
      marker.bindPopup(
        `<strong>${escapeHtml(pin.name)}</strong><br>${escapeHtml(pin.address)}<br>` +
        `<a href="#/parc/node/${encodeURIComponent(pin.nodeId)}">Voir ce client</a>`
      );
      return marker;
    });

    if (markers.length > 1) {
      mapInstance.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
    } else {
      mapInstance.setView([pins[0].lat, pins[0].lng], 13);
    }

    mapLoaded = true;
  } catch (err) {
    statusEl.hidden = false;
    statusEl.textContent = "Erreur : " + err.message;
    console.error(err);
  }
}

document.getElementById("mapRefreshBtn").addEventListener("click", () => {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapLoaded = false;
  // On force aussi le rafraîchissement de la liste des agents/clients (cache
  // partagé avec la recherche) : un nouveau client ajouté depuis la dernière
  // ouverture de la carte doit apparaître sans recharger toute la page.
  allAgentsCache = null;
  allAgentsPromise = null;
  loadMapPage();
});

/* =========================================================
   Routeur (hash-based)
   ========================================================= */

const pageAlerts = document.getElementById("page-alerts");
const pageParc = document.getElementById("page-parc");
const pageMap = document.getElementById("page-map");
const pageWhatsNew = document.getElementById("page-whatsnew");
const parcTreeView = document.getElementById("parcTreeView");
const parcAgentView = document.getElementById("parcAgentView");
const searchBarWrap = document.getElementById("searchBarWrap");

function parseHash() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/parc\/agent\/(.+)$/))) return { page: "parc", view: "agent", agentId: decodeURIComponent(m[1]) };
  if ((m = h.match(/^#\/parc\/node\/(.+)$/))) return { page: "parc", view: "tree", nodeId: decodeURIComponent(m[1]) };
  if (h === "#/alerts") return { page: "alerts" };
  if (h === "#/map") return { page: "map" };
  if (h === "#/whatsnew") return { page: "whatsnew" };
  return { page: "parc", view: "tree", nodeId: ROOT_NODE_ID }; // Parc = page par defaut
}

function router() {
  const r = parseHash();
  currentPage = r.page;

  pageAlerts.hidden = currentPage !== "alerts";
  pageParc.hidden = currentPage !== "parc";
  pageMap.hidden = currentPage !== "map";
  pageWhatsNew.hidden = currentPage !== "whatsnew";
  searchBarWrap.hidden = currentPage === "map" || currentPage === "whatsnew"; // la recherche ne porte que sur les agents/alertes
  // Le champ filtre des agents (nom/IP/OS/série) sur Parc, mais du texte
  // d'alerte (titre/agent/chemin) sur Alertes : le libellé doit refléter
  // ce qu'on tape réellement, pas rester générique partout.
  searchInputEl.placeholder = currentPage === "alerts" ? "Rechercher une alerte..." : "Rechercher un agent...";

  if (currentPage === "alerts") {
    renderAlertList();
    return;
  }
  if (currentPage === "map") {
    loadMapPage();
    return;
  }
  if (currentPage === "whatsnew") {
    renderWhatsNew();
    return;
  }

  updateParcVisibility();
  if (searchQuery.trim().length >= 2) {
    renderParcSearch();
    return;
  }

  const onAgent = r.view === "agent";
  if (onAgent) loadAgent(r.agentId);
  else loadNode(r.nodeId);
}

window.addEventListener("hashchange", router);

document.getElementById("homeLink").addEventListener("click", () => {
  searchQuery = "";
  searchInputEl.value = "";
  location.hash = "#/parc";
});

loadAlerts();
router();

// Pas de service worker : ce dashboard n'a pas d'utilité hors-ligne, et un
// cache periodiquement perime a cause plus de soucis (pages figees apres une
// mise a jour) qu'il n'apporte de benefice. On se contente de nettoyer une
// eventuelle installation precedente (versions anterieures de cette app).
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => {
    regs.forEach((r) => r.unregister());
  });
}
if (window.caches) {
  caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
}
</script>
